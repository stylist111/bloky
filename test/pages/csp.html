<script>
  document.addEventListener("securitypolicyviolation", e =>
  {
    document.documentElement.dataset.violatedDirective = e.violatedDirective;
  });

  window.addEventListener("load", () =>
  {
    if (!document.documentElement.dataset.violatedDirective)
      document.documentElement.dataset.violatedDirective = "unset";
  });
</script>
