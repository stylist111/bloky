spec:
  inputs:
    job_runs:
      type: number
      default: 1
      description: Amount of times certain test jobs should run using the "parallel" keyword

---
include: "/.gitlab/ci-common.yml"

default:
  image: node:24.20.0
  cache: # Cache modules using lock file
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  tags:
    - "GCP"
  interruptible: true

stages:
  - build
  - check-source
  - compliance
  - end-to-end

################################################################################
# Build
################################################################################

buildfromsource:
  stage: build
  needs:
    - !reference [.needs-parent-build-release, needs]
  script:
    # We need to generate the builds outside of the git repo to avoid any
    # implicit dependencies to git in our build scripts
    - mkdir /tmp/source
    - tar xvf host/adblock/dist/release/adblock-*.tar.gz -C /tmp/source
    - cd /tmp/source
    - npm ci --cache .npm --prefer-offline
    # Create extension builds from source archive
    - npm run build:release -- --scope=adblock
  after_script:
    # We cannot refer to artifacts in directories outside of the project
    - cp -r /tmp/source/host/adblock/dist/release host/adblock/dist/source
  artifacts:
    name: "adblock-source-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - host/adblock/dist/source/adblock-chrome-*-mv3.zip
      - host/adblock/dist/source/adblock-firefox-*-mv2.xpi

################################################################################
# Check source archive files
################################################################################

.check-source-files:
  image: alpine:latest
  stage: check-source
  needs:
    - !reference [.needs-parent-build-release, needs]
  script:
    - unzip -d unpacked-extension/ host/adblock/dist/release/$EXTENSION
    - cd unpacked-extension/
    # Verify that source archive contains no symlinks
    - if find . -type l | grep -q .; then
      echo "Source archive contains symlinks:" &&
      find . -type l &&
      exit 1;
      fi
    # Verify that source archive contains no large files
    - if [ $(find . -type f -name '*.js' -size +4000k | wc -l) -gt 0 ]; then
      echo 'Some extension files are bigger than 4 MB:' &&
      find . -type f -name '*.js' -size +4000k -exec ls -lh {} \; &&
      exit 1;
      else
      echo 'All extension files are smaller than 4 MB' &&
      exit 0;
      fi

check-source:files:MV3:chrome:
  extends: .check-source-files
  variables:
    EXTENSION: adblock-chrome-*-mv3.zip

check-source:files:MV2:firefox:
  extends: .check-source-files
  variables:
    EXTENSION: adblock-firefox-*-mv2.xpi

################################################################################
# Check manifest
################################################################################

.check-source-manifest:
  stage: check-source
  needs:
    - !reference [.needs-parent-build-release, needs]
  script:
    - unzip -p host/adblock/dist/release/$EXTENSION manifest.json > manifest.json
    - node tools/release/check-manifest.js manifest.json

check-source:manifest:MV3:chrome:
  extends: .check-source-manifest
  variables:
    EXTENSION: adblock-chrome-*-mv3.zip
    EXPECTED_PERMISSIONS: >-
      alarms contextMenus declarativeNetRequestWithHostAccess idle notifications
      scripting storage tabs unlimitedStorage webNavigation webRequest
    EXPECTED_OPTIONAL_PERMISSIONS: "management"
    EXPECTED_HOST_PERMISSIONS: "<all_urls>"

check-source:manifest:MV2:firefox:
  extends: .check-source-manifest
  variables:
    EXTENSION: adblock-firefox-*-mv2.xpi
    EXPECTED_PERMISSIONS: >-
      <all_urls> alarms contextMenus idle notifications storage tabs
      unlimitedStorage webNavigation webRequest webRequestBlocking
    EXPECTED_OPTIONAL_PERMISSIONS: "management"

################################################################################
# Check source archive builds
################################################################################

.check-source-builds:
  stage: check-source
  needs:
    - !reference [.needs-parent-build-release, needs]
    - "buildfromsource"
  before_script:
    - if [ ! -f $SOURCE_BUILD ] || [ ! -f $REPOSITORY_BUILD ]; then
      echo "File not found" &&
      exit 1;
      fi
  script:
    # Verify that source archive build is similar to actual build
    - if((`stat -c%s $REPOSITORY_BUILD`!=`stat -c%s $SOURCE_BUILD`)); then
      echo "Build from source archive and build from the repository are not the same size" &&
      ls -l $REPOSITORY_BUILD &&
      ls -l $SOURCE_BUILD &&
      exit 1;
      else
      echo "Build from source archive and build from the repository are the same size" &&
      exit 0;
      fi

check-source:builds:MV3:chrome:
  extends: .check-source-builds
  variables:
    REPOSITORY_BUILD: host/adblock/dist/release/adblock-chrome-*-mv3.zip
    SOURCE_BUILD: host/adblock/dist/source/adblock-chrome-*-mv3.zip

check-source:builds:MV2:firefox:
  extends: .check-source-builds
  variables:
    REPOSITORY_BUILD: host/adblock/dist/release/adblock-firefox-*-mv2.xpi
    SOURCE_BUILD: host/adblock/dist/source/adblock-firefox-*-mv2.xpi

################################################################################
# Compliance tests
################################################################################

.docker:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - !reference [.needs-parent-build-release, needs]

.compliance:
  stage: compliance
  extends: .docker
  before_script:
    - apk add bash git
  script:
    - TERMINAL=t EXTENSION=host/adblock/dist/release/$EXTENSION ./host/adblock/test/compliance.sh
  after_script:
    - docker cp $(docker ps -aqf ancestor=compliance):/testpages.adblockplus.org/test/screenshots host/adblock/ 2> /dev/null
  artifacts:
    paths:
      - host/adblock/screenshots/
    when: on_failure
    expire_in: 1 month

comp:MV3:chrome:latest:
  extends: .compliance
  variables:
    BROWSER: chrome latest
    EXTENSION: adblock-chrome-*-mv3.zip

comp:MV3:edge:latest:
  extends: .compliance
  variables:
    BROWSER: edge latest
    EXTENSION: adblock-chrome-*-mv3.zip

comp:MV2:firefox:latest:
  extends: .compliance
  variables:
    BROWSER: firefox latest
    EXTENSION: adblock-firefox-*-mv2.xpi

comp:MV2:firefox:oldest:
  extends: .compliance
  variables:
    BROWSER: firefox 128.0
    EXTENSION: adblock-firefox-*-mv2.xpi

################################################################################
# End-to-end tests
################################################################################

.end-to-end:
  stage: end-to-end
  extends: .docker
  script:
    - echo "EYEOMETRY_BEARER=\"$ADBLOCK_EYEOMETRY_BEARER\"" >> host/adblock/.env
    - docker build -t end-to-end -f host/adblock/test/end-to-end/Dockerfile .
    - docker run --shm-size=2g -t -e BROWSER -e BROWSER_VERSION -e MANIFEST_VERSION -e CI end-to-end
  after_script:
    - IMAGE_ID=$(docker ps -aqf ancestor=end-to-end)
    - docker cp $IMAGE_ID:/extensions/host/adblock/test/end-to-end/screenshots host/adblock/ 2> /dev/null
  artifacts:
    paths:
      - host/adblock/screenshots/
    when: on_failure
    expire_in: 1 mo

.end-to-end-n-times:
  extends: .end-to-end
  parallel: $[[ inputs.job_runs ]]

end-to-end:MV2:firefox:latest:
  extends: .end-to-end-n-times
  variables:
    BROWSER: firefox
    MANIFEST_VERSION: 2

end-to-end:MV3:edge:latest:
  extends: .end-to-end-n-times
  variables:
    BROWSER: edge
    MANIFEST_VERSION: 3

end-to-end:MV3:chrome:latest:
  extends: .end-to-end-n-times
  variables:
    BROWSER: chrome
    MANIFEST_VERSION: 3

# End-to-end tests - nightly run
.end-to-end-nightly:
  extends: .end-to-end
  rules:
    - !reference [.nightly-run, rules]

end-to-end:MV2:firefox:beta:
  extends: .end-to-end-nightly
  variables:
    MANIFEST_VERSION: 2
    BROWSER: firefox
    BROWSER_VERSION: beta

end-to-end:MV3:chrome:beta:
  extends: .end-to-end-nightly
  variables:
    MANIFEST_VERSION: 3
    BROWSER: chrome
    BROWSER_VERSION: beta
