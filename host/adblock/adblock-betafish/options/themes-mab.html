<!-- Bloky: one appearance setting for the toolbar window and this page — system, light or dark -->
<div class="option-page-box mab-page-box">
  <div class="option-page-content">
    <header class="b-page-head">
      <h1 class="page-title" i18n="themes"></h1>
      <p class="b-lead" i18n="bloky_theme_lead"></p>
    </header>
    <div class="b-card b-themes" role="radiogroup">
      <label class="b-theme" data-theme-option="default_theme">
        <input type="radio" name="bloky-theme" value="default_theme" class="b-theme-input" />
        <span class="b-theme-preview is-system" aria-hidden="true">
          <span class="b-theme-side"></span>
          <span class="b-theme-main"><i></i><i></i><i></i></span>
        </span>
        <span class="b-theme-text">
          <span class="b-row-title" i18n="bloky_theme_system"></span>
          <span class="b-row-desc" i18n="bloky_theme_system_text"></span>
        </span>
      </label>
      <label class="b-theme" data-theme-option="light_theme">
        <input type="radio" name="bloky-theme" value="light_theme" class="b-theme-input" />
        <span class="b-theme-preview is-light" aria-hidden="true">
          <span class="b-theme-side"></span>
          <span class="b-theme-main"><i></i><i></i><i></i></span>
        </span>
        <span class="b-theme-text">
          <span class="b-row-title" i18n="bloky_theme_light"></span>
          <span class="b-row-desc" i18n="bloky_theme_light_text"></span>
        </span>
      </label>
      <label class="b-theme" data-theme-option="dark_theme">
        <input type="radio" name="bloky-theme" value="dark_theme" class="b-theme-input" />
        <span class="b-theme-preview is-dark" aria-hidden="true">
          <span class="b-theme-side"></span>
          <span class="b-theme-main"><i></i><i></i><i></i></span>
        </span>
        <span class="b-theme-text">
          <span class="b-row-title" i18n="dark_theme"></span>
          <span class="b-row-desc" i18n="bloky_theme_dark_text"></span>
        </span>
      </label>
    </div>
  </div>
</div>
