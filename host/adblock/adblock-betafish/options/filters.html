<!-- Bloky: filter lists in cards; the "Premium filters" teaser is gone (they are free) -->
<div class="option-page-box">
  <div class="option-page-content">
    <div id="message_holder" class="failed_fetch error-message"></div>

    <header class="b-page-head b-page-head-row">
      <div>
        <h1 i18n="filterstabtitle" class="page-title"></h1>
        <p class="b-lead" i18n="bloky_filters_lead"></p>
      </div>
      <button
        class="b-btn secondary"
        type="button"
        id="btnUpdateNow"
        i18n-aria-label="update_filter_lists_now"
      >
        <i class="material-icons" aria-hidden="true">refresh</i
        ><span i18n="bloky_update_now"></span>
      </button>
    </header>

    <div id="filter_subscriptions">
      <h2 i18n="adblockinglist" class="b-group-title"></h2>

      <div id="easylist_info" class="b-note">
        <b><span i18n="easylist_disable_done"></span></b>
        <span i18n="easylist_disable_how_to_reenable"></span>
      </div>
      <div class="b-card b-list-card">
        <div id="ad_blocking_list"></div>
        <div id="language_list"></div>
        <div id="language_dropdown_container" class="b-row">
          <span class="b-row-text"
            ><span class="b-row-title" i18n="languagedropdowndescription"></span
          ></span>
          <div id="language-select-box">
            <select id="language_select" aria-labelledby="language_dropdown_container">
              <option value="" i18n="selectlanguage2"></option>
            </select>
          </div>
        </div>
      </div>

      <h2 i18n="otherfilters" class="b-group-title"></h2>
      <div class="b-card b-list-card">
        <div id="other_filter_lists"></div>
      </div>

      <h2 i18n="customfilters" class="b-group-title"></h2>
      <div class="b-card b-list-card">
        <div id="custom_filter_lists"></div>
        <div class="b-row b-add-list">
          <input id="txtNewSubscriptionUrl" type="text" placeholder="https://" />
          <button
            class="b-btn primary"
            type="button"
            id="btnNewSubscriptionUrl"
            i18n="subscribebutton"
          ></button>
        </div>
      </div>
    </div>

    <p class="b-footnote">
      <span i18n="filterlistlink" i18n_replacement_el="filterlistlink">
        <a id="filterlistlink" href="https://adblockplus.org/en/subscriptions" target="_blank"></a>
      </span>
      <a id="btnShowLinks" class="advanced" href="#" i18n="showlinkstolists2"></a>
    </p>
  </div>
</div>
