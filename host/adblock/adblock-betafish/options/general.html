<!-- Bloky: settings grouped into cards, every switch on the right with a short explanation -->
<div id="jq-options" class="option-page-box">
  <div class="option-page-content">
    <header class="b-page-head">
      <h1 i18n="generaloptions2" class="page-title"></h1>
      <p class="b-lead" i18n="bloky_general_lead"></p>
    </header>

    <div id="acceptable_ads_info" class="b-note">
      <span i18n="acceptableadsdisable_done"></span>
      <span i18n="acceptableadsdisable_how_to_reenable"></span>
    </div>

    <h2 class="b-group-title" i18n="bloky_group_ads"></h2>
    <ul id="general-option-list" class="b-card b-rows">
      <li class="b-row">
        <label class="b-row-text" for="acceptable_ads" id="acceptable_ads_label">
          <span class="b-row-title" i18n="acceptableadsoption"></span>
          <span class="b-row-desc" i18n="bloky_desc_acceptable_ads"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="acceptable_ads"
            aria-labelledby="acceptable_ads_label"
          />
        </span>
      </li>
      <li class="b-row b-row-sub">
        <label class="b-row-text" for="acceptable_ads_privacy" id="acceptable_ads_privacy_label">
          <span class="b-row-title" i18n="acceptable_ads_privacy"></span>
          <span class="b-row-desc" id="aa-privacy-helper" i18n="enable_do_not_track_advice"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="acceptable_ads_privacy"
            aria-labelledby="acceptable_ads_privacy_label"
          />
        </span>
      </li>
    </ul>

    <h2 class="b-group-title" i18n="bloky_group_button"></h2>
    <ul class="b-card b-rows">
      <li class="b-row">
        <label
          class="b-row-text"
          for="prefs__shouldShowBlockElementMenu"
          id="prefs__shouldShowBlockElementMenu_label"
        >
          <span class="b-row-title" i18n="showcontextmenus2"></span>
          <span class="b-row-desc" i18n="bloky_desc_context_menu"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="prefs__shouldShowBlockElementMenu"
            aria-labelledby="prefs__shouldShowBlockElementMenu_label"
          />
        </span>
      </li>
      <li class="b-row">
        <label class="b-row-text" for="prefs__show_statsinicon" id="prefs__show_statsinicon_label">
          <span class="b-row-title" i18n="show_on_adblock_button"></span>
          <span class="b-row-desc" i18n="bloky_desc_count_button"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="prefs__show_statsinicon"
            aria-labelledby="prefs__show_statsinicon_label"
          />
        </span>
      </li>
      <li class="b-row">
        <label
          class="b-row-text"
          for="enable_display_menu_stats"
          id="enable_display_menu_stats_label"
        >
          <span class="b-row-title" i18n="show_on_adblock_menu"></span>
          <span class="b-row-desc" i18n="bloky_desc_count_menu"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="enable_display_menu_stats"
            aria-labelledby="enable_display_menu_stats_label"
          />
        </span>
      </li>
    </ul>

    <h2 class="b-group-title" i18n="bloky_group_advanced"></h2>
    <ul class="b-card b-rows">
      <li class="b-row">
        <label
          class="b-row-text"
          for="prefs__show_devtools_panel"
          id="prefs__show_devtools_panel_label"
        >
          <span class="b-row-title" i18n="show_devtools_panel"></span>
          <span class="b-row-desc" i18n="bloky_desc_devtools"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="prefs__show_devtools_panel"
            aria-labelledby="prefs__show_devtools_panel_label"
          />
        </span>
      </li>
      <li class="b-row">
        <label
          class="b-row-text"
          for="enable_show_advanced_options"
          id="enable_show_advanced_options_label"
        >
          <span class="b-row-title" i18n="advanced_options2"></span>
          <span class="b-row-desc" i18n="bloky_desc_advanced"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="enable_show_advanced_options"
            aria-labelledby="enable_show_advanced_options_label"
          />
        </span>
      </li>
      <li class="b-row advanced forDebug">
        <label class="b-row-text" for="enable_debug_logging" id="enable_debug_logging_label">
          <span class="b-row-title" i18n="debuginlogoption2"></span>
          <span class="b-row-desc" i18n="slows_down_extension"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="enable_debug_logging"
            aria-labelledby="enable_debug_logging_label"
          />
        </span>
      </li>
      <li id="main_opt_out" class="b-row bloky-hidden">
        <label
          class="b-row-text"
          for="prefs__data_collection_opt_out"
          id="prefs__data_collection_opt_out_label"
        >
          <span class="b-row-title" i18n="data_collection_opt_out"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="prefs__data_collection_opt_out"
            aria-labelledby="prefs__data_collection_opt_out_label"
          />
        </span>
      </li>
      <li class="b-row data-collection-option-container bloky-hidden">
        <label
          class="b-row-text"
          for="enable_data_collection_v2"
          id="enable_data_collection_v2_label"
        >
          <span class="b-row-title" i18n="datacollectionoption"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="enable_data_collection_v2"
            aria-labelledby="enable_data_collection_v2_label"
          />
        </span>
      </li>
      <li class="b-row bloky-hidden">
        <label
          class="b-row-text"
          for="prefs__marketing_opt_out"
          id="prefs__marketing_opt_out_label"
        >
          <span class="b-row-title" i18n="marketing_opt_out"></span>
        </label>
        <span class="checkbox md-stack">
          <input
            type="checkbox"
            class="feature"
            id="prefs__marketing_opt_out"
            aria-labelledby="prefs__marketing_opt_out_label"
            data-pref-transform="invert"
          />
        </span>
      </li>
    </ul>
  </div>
</div>
