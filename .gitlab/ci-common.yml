variables:
  # Branch of the weekly release MR, pushed by tools/release/prepare-release.sh
  RELEASE_BRANCH: mr-automaton-release

.needs-parent-build:
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: build

.needs-parent-build-release:
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: build:release

.only-run-on-update-rules-trigger:
  rules:
    - if: $UPDATE_RULES == "true"
      when: on_success
    - when: never

.only-run-on-prepare-release-trigger:
  rules:
    - if: $PREPARE_RELEASE == "true"
      when: on_success
    - when: never

.never-run-on-bot-trigger:
  rules:
    - if: $UPDATE_RULES == "true" || $PREPARE_RELEASE == "true"
      when: never

.never-run-on-release-branch:
  rules:
    - if: $CI_COMMIT_REF_NAME == $RELEASE_BRANCH
      when: never

.only-run-on-release-branch:
  rules:
    - if: $CI_COMMIT_REF_NAME == $RELEASE_BRANCH
      when: on_success
    - when: never

# Full set of tests. Some regular jobs run multiple times, additional jobs use
# other browser versions (i.e. beta)
.nightly-run:
  # This job will never be cancelled automatically, even if the pipeline is auto-cancelled
  interruptible: false
  rules:
    - if: $NIGHTLY_RUN == "true"
