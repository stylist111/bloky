# Bloky filter updates: every few hours, mirror the filter-list diffs that Bloky
# downloads and publish them on GitHub Pages (https://stylist111.github.io/bloky/).
name: Filter updates

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: filters
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_try.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get the filter lists package Bloky is built with
        run: |
          version=$(node -p "require('./tools/rules/package.json').dependencies['@eyeo/filterlists']")
          mkdir -p /tmp/fl && cd /tmp/fl
          npm pack "@eyeo/filterlists@${version}" --silent
          tar -xzf eyeo-filterlists-*.tgz

      - name: Mirror filter updates
        run: node tools/bloky/mirror-filters.mjs /tmp/fl/package/filterlists site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub sometimes can't find the just-uploaded artifact for a few seconds
      # ("No artifacts named github-pages were found"). Wait and try again.
      - id: deploy_try
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.deploy_try.outcome == 'failure'
        run: sleep 60

      - id: deploy_retry
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v5
