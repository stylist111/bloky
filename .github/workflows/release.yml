# Bloky release: push a tag vX.Y.Z (the same as "version" in
# host/adblock/build/config/base.mjs) and GitHub builds the Chrome extension zip,
# its SHA256 and a build provenance attestation, and attaches them to a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - name: Use the npm version the project expects
        run: npm install -g npm@11.19.1

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -e "import('./host/adblock/build/config/base.mjs').then(m => console.log(m.default.version))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in host/adblock/build/config/base.mjs"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build:release -- --scope adblock -- chrome 3

      - name: Collect the zip
        run: |
          mkdir out
          v="${VERSION:-$(git rev-parse --short HEAD)}"
          cp host/adblock/dist/release/*.zip "out/bloky-chrome-${v}.zip"
          cd out && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bloky
          path: out/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Bloky ${VERSION}" \
            --notes "Сборка для Chrome. Как поставить вручную — в README, раздел «Установка»."
