# Weekly check for AdBlock (eyeo) updates.
#
# If eyeo has new commits, they are merged into the branch "upstream-sync", the
# extension is built and unit-tested, and a pull request is opened (or updated) with
# the list of changes and anything that looks like new servers, Premium upsells or
# telemetry. Nothing is released automatically: the PR is reviewed first.
# If the merge has conflicts, an issue is opened instead.
name: AdBlock updates

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: https://gitlab.com/eyeo/browser-extensions-and-premium/extensions/extensions.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch AdBlock
        id: fetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with AdBlock."
            echo "new=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Merge into upstream-sync
        id: merge
        if: steps.fetch.outputs.new != '0'
        run: |
          git checkout -B upstream-sync
          if git merge --no-edit upstream/main; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Report conflicts
        if: steps.merge.outputs.ok == '0'
        run: |
          {
            echo "В AdBlock вышли изменения (${{ steps.fetch.outputs.new }} шт., до ${{ steps.fetch.outputs.head }}), но они не соединились с Bloky автоматически."
            echo
            echo "Файлы с конфликтами:"
            sed 's/^/- `/; s/$/`/' /tmp/conflicts.txt
          } > /tmp/body.md
          num=$(gh issue list --state open --label upstream --json number -q '.[0].number')
          gh label create upstream --color 0E8A16 --description "Обновления из AdBlock" 2>/dev/null || true
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file /tmp/body.md
          else
            gh issue create --title "Обновление AdBlock требует ручного слияния" --label upstream --body-file /tmp/body.md
          fi

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.ok == '1'
        with:
          node-version: "24.20.0"

      - name: Build and test
        id: test
        if: steps.merge.outputs.ok == '1'
        continue-on-error: true
        run: |
          npm install -g npm@11.19.1
          npm ci --no-audit --no-fund
          npm run build:release -- --scope adblock -- chrome 3
          cd host/adblock && npx vitest run ./src/ ./test/unit/

      - name: Look for anything suspicious
        if: steps.merge.outputs.ok == '1'
        run: |
          git diff main...upstream/main -- host/adblock core/sdk/src fragment \
            ':(exclude)*.md' ':(exclude)*/_locales/*' ':(exclude)*/locales/*' ':(exclude)*test*' ':(exclude)*.spec.*' \
            | grep -E '^\+[^+]' \
            | grep -inE 'https?://|premium|telemetry|\bping\b|sentry|tracking|getadblock|eyeo\.it|license|upsell|\bcta\b|survey|account' \
            | head -80 > /tmp/suspicious.txt || true

      - name: Open or update the pull request
        if: steps.merge.outputs.ok == '1'
        run: |
          git push -f origin upstream-sync
          {
            echo "Еженедельная проверка: в AdBlock вышли изменения — **${{ steps.fetch.outputs.new }}** шт. (до \`${{ steps.fetch.outputs.head }}\`)."
            echo
            if [ "${{ steps.test.outcome }}" = "success" ]; then
              echo "✅ Сборка и тесты прошли."
            else
              echo "❌ Сборка или тесты упали — смотрите журнал запуска: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
            echo
            echo "### Что проверить перед слиянием"
            echo "Строки, которые добавил AdBlock и в которых есть адреса серверов или слова вроде premium / telemetry / ping:"
            echo
            if [ -s /tmp/suspicious.txt ]; then
              echo '```'
              cat /tmp/suspicious.txt
              echo '```'
            else
              echo "_Ничего такого не нашлось._"
            fi
            echo
            echo "### Изменения AdBlock"
            git log --no-merges --format='- %s' main..upstream/main | head -100
          } > /tmp/pr.md
          num=$(gh pr list --head upstream-sync --state open --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh pr edit "$num" --body-file /tmp/pr.md
          else
            gh pr create --base main --head upstream-sync --title "Обновления из AdBlock" --body-file /tmp/pr.md
          fi
