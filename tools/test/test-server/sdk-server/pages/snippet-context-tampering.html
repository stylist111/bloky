<html>
  <head>
    <script>
      /**
       * Makes a property on an object non-writable and non-configurable.
       * @param {object} obj The object.
       * @param {string} prop The property name.
       */
      function secureProperty(obj, prop) {
        try {
          Object.defineProperty(obj, prop, { writable: false, configurable: false });
        } catch (e) {
          // noop
        }
      }

      // Secure various global objects and methods to prevent modification.
      secureProperty(window, "fetch");
      secureProperty(window, "JSON");
      secureProperty(window.JSON, "stringify");
      secureProperty(window.JSON, "parse");
      secureProperty(window, "Array");
      secureProperty(Array.prototype, "push");
      secureProperty(Array.prototype, "forEach");
      // This line is critical for the error: it makes Object.assign read-only and non-configurable.
      secureProperty(Object, "assign");
    </script>
  </head>
  <body>
    <div id="json-prune-object-tampering">JSON Prune Tampering</div>
    <script>
      let testProperties = `{
    "jsonprune": "true",
    "data-expectedresult": "fail",
    "aria-label": "json-prune-fail",
    "object": {
      "data1": {
        "target-data": "delete-me"
      },
      "data2": {
        "target-data": "delete-me"
      },
      "data3": {
        "different-data": "dont-delete-me"
      }
    }
  }`;

      const testObject = JSON.parse(testProperties);

      // Check for "target-data" in object
      let noTargetDataInObject = Object.values(testObject.object).every(
        (innerObj) => !Object.keys(innerObj).includes("target-data"),
      );

      if (noTargetDataInObject) {
        document.getElementById("json-prune-object-tampering").hidden = true;
      }
    </script>
  </body>
</html>
