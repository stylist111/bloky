<div id="to-be-overriden" data-expectedresult="fail">Snippet has not executed</div>

<script>
  "use strict";

  // This must be var, not const, for the snippet to work
  // eslint-disable-next-line no-var
  var overridePropertyRead = {
    fp: true,
  };

  function checkSnippet() {
    if (!overridePropertyRead.fp) {
      document.getElementById("to-be-overriden").hidden = true;
    } else {
      setTimeout(checkSnippet, 100);
    }
  }

  checkSnippet();
</script>
