spec:
  inputs:
    job_runs:
      type: number
      default: 1
      description: Amount of times certain test jobs should run using the "parallel" keyword

---

include: "/.gitlab/ci-common.yml"

default:
  interruptible: true
  image: node:24.14.1
  tags:
    - "GCP"

variables:
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"
  # Oldest supported versions
  OLDEST_CHROMIUM_MV2_VERSION: "127.0.6533.0"
  OLDEST_CHROMIUM_MV3_VERSION: "127.0.6533.0"
  OLDEST_FIREFOX_VERSION: "128.0"
  # Oldest version get-browser-binary can install for Edge (numeric versions
  # below this are rejected by the tooling, and only resolve on Linux)
  OLDEST_EDGE_MV2_VERSION: "114.0.1823.37"
  # Latest Chromium version that still supports MV2
  LATEST_CHROMIUM_MV2_VERSION: "128.0.6613.0"

# Pipeline rules
workflow:
  rules:
    # Do not trigger merge request pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

# Jobs using this rule only run on the main branch pipelines
.main-run:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Won't be triggered on flaky debugging pipelines
.avoid-flaky-run:
  rules:
    # Run manually on commits that contain [flaky]
    - if: $CI_COMMIT_MESSAGE =~ /\[flaky]/
      when: manual
    # Run automatically if other conditions not filled
    - when: on_success

.docker-image:
  image: docker:24.0.5
  services:
    - "docker:24.0.5-dind"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE
    BASIC_IMAGE: $IMAGE_TAG:basic-image-$CI_PIPELINE_ID
    FUNCTIONAL_IMAGE: $IMAGE_TAG:functional-image-$CI_PIPELINE_ID
    COMPLIANCE_IMAGE: $IMAGE_TAG:compliance-image-$CI_JOB_ID
    DOCKER_OPTIONS: --shm-size=2g -t

.macos-image:
  image: macos-26-xcode-26
  tags:
    - eyeo-macos-tart
  before_script:
    - nvm use 24.8.0

stages:
  - build
  - unit
  - test
  - functional
  - fuzz
  - compliance
  - integration
  - performance

build:docs:
  stage: build
  before_script:
    - npm install
  script:
    - DOCS_ERROR=$(npm run -w=@eyeo/webext-ad-filtering-solution docs 2>&1 >/dev/null) && if [ ! -z "$DOCS_ERROR" ]; then echo $DOCS_ERROR && false; fi
    - npm run -w=@eyeo/webext-ad-filtering-solution docs-adblockpluscore
  artifacts:
    paths:
      - core/sdk/public/
    expire_in: 1 week

build:safari:
  extends: .macos-image
  stage: build
  needs:
    - !reference [.needs-parent-build, needs]
  before_script:
    - !reference [.macos-image, before_script]
    - npm install
  script:
    - npm run -w=@eyeo/webext-ad-filtering-solution build:safari
  artifacts:
    paths:
      - core/sdk/dist/testSafariApp/build/Release-iphonesimulator/testSafariApp.app
    expire_in: 1 week

# Publishes the docs to https://eyeo.gitlab.io/browser-extensions-and-premium/extensions/extensions/sdk/
# and https://eyeo.gitlab.io/browser-extensions-and-premium/extensions/extensions/sdk/adblockpluscore/
# Requirements: https://docs.gitlab.com/ee/user/project/pages/introduction.html#gitlab-pages-requirements
pages:
  stage: build
  needs: ["build:docs"]
  script:
    # Check that docs folder exists
    - "[ -d \"core/sdk/public\" ]"
    - mkdir -p public/sdk/
    - cp -r core/sdk/public/ public/sdk/
  artifacts:
    paths:
      - public/
  rules:
    # Only publishes docs pushed to main
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

.build-image:
  stage: build
  extends: .docker-image
  needs: []
  # Occasional network issues may prevent docker images from building
  retry: 1

build:basic-image:
  extends: .build-image
  script:
    - docker build -t $BASIC_IMAGE -f core/sdk/test/dockerfiles/basic.Dockerfile .
    - docker push $BASIC_IMAGE

build:functional-image:
  extends: .build-image
  needs:
    - !reference [.needs-parent-build, needs]
  script:
    - docker build -t $FUNCTIONAL_IMAGE -f core/sdk/test/dockerfiles/functional.Dockerfile --build-arg BROWSERS="chromium chrome" .
    - docker push $FUNCTIONAL_IMAGE

.basic-image:
  extends: .docker-image
  needs: ["build:basic-image"]

# Unit tests

adblockpluscore:browser:
  stage: unit
  extends: .basic-image
  script:
    - docker run $DOCKER_OPTIONS --entrypoint npm $BASIC_IMAGE run -w adblockpluscore test:browser
  rules:
    - !reference [.avoid-flaky-run, rules]

# Functional tests
.functional:
  stage: functional
  extends: .docker-image
  needs: ["build:functional-image"]
  script:
    COMMIT_FIRST_LINE=$(echo "$CI_COMMIT_MESSAGE" | head -1);
    if [ -z "${COMMIT_FIRST_LINE##*"[flaky]"*}" ]; then
      echo "The first line of the commit message contains the [flaky] tag!";
      OTHER_PARAMS="-e ONLY_FLAKY=true";
    fi;
    docker run $DOCKER_OPTIONS -e TEST_PARAMS="$TEST_PARAMS" $OTHER_PARAMS $FUNCTIONAL_IMAGE;
  after_script:
    if [[ $CI_JOB_STATUS == "failed" ]]; then
      docker cp $(docker ps -aqf ancestor=$FUNCTIONAL_IMAGE):/extensions/core/sdk/test/screenshots core/sdk/;
    fi;
  artifacts:
    paths:
      - core/sdk/screenshots/
    when: on_failure
    expire_in: 1 week
  # We set a custom timeout here to allow for more time to run functional tests
  # in scheduled pipelines, as they can take longer than one hour.
  # Note that we cannot apply it ot the entire pipeline by adding it to the
  # "default" section: https://gitlab.com/gitlab-org/gitlab/-/issues/213634
  timeout: 2h

# This template runs a job N times, it is set to 1 by default
.functional-n-times:
  extends: .functional
  parallel: $[[ inputs.job_runs ]]

# Functional tests - MV2
func:v2:chromium:oldest:
  extends: .functional-n-times
  variables:
    BROWSER: chromium $OLDEST_CHROMIUM_MV2_VERSION
    TEST_PARAMS: 2 $BROWSER

func:v2:firefox:latest:
  extends: .functional-n-times
  variables:
    BROWSER: firefox latest
    TEST_PARAMS: 2 $BROWSER

func:v2:firefox:oldest:
  extends: .functional-n-times
  variables:
    BROWSER: firefox $OLDEST_FIREFOX_VERSION
    TEST_PARAMS: 2 $BROWSER

.functional-windows:
  stage: functional
  needs:
    - !reference [.needs-parent-build, needs]
  variables:
    # The eyeo windows CI runners fail to check out large numbers of packages,
    # like the extensions monorepo, if npm can't retry fetching dependencies.
    npm_config_fetch_retries: 2
  before_script:
    # Fail the job if any before_script step errors. PowerShell cmdlet errors
    # are non-terminating by default, so a broken setup step would otherwise let
    # the job go green without running the tests.
    - $ErrorActionPreference = "Stop"
    # While eyeo-windows doesn't come with Node 24 out of the box yet, we need
    # to install it ourselves
    - choco uninstall -y nodejs nodejs.install
    - choco install -y --no-progress nodejs-lts --version 24.14.1
    - npm install
    # Edge 150 self-stages its AppX package on launch (StagePackageByUriAsync),
    # which runs setup.exe; on the runner that crashed with 0xc06d007e (a
    # missing-module / VC++ runtime error) and tore the test session down.
    # Install the VC++ 2015-2022 runtime so setup.exe has its dependencies and
    # can complete the stage without crashing.
    - choco install vcredist140 -y --no-progress
    # The runner image installs Edge via choco at build time, so it ships an
    # older build. Upgrade to the current stable so the tests run the version
    # under test (.65).
    - choco upgrade microsoft-edge -yf
    # Edge 150 self-repairs a few seconds after launch, rewriting the files the
    # running msedge.exe executes from and tearing down the test session
    # mid-suite. Run Edge from a private copy of the install dir instead: the
    # self-repair rewrites the original location while our copy keeps running,
    # so the session survives the whole suite. Edge is installed on the runner
    # as a plain MSI (the Enterprise MSI via choco), not an MSIX/Store package,
    # so its files live under Program Files\Microsoft\Edge\Application - copy
    # that dir with robocopy and hand the path to the tests via EDGE_RUN_COPY
    # (see functional.js). Every failure path exits non-zero so a broken copy
    # makes the job go red instead of a fake green on the wrong or no Edge.
    - |
      try {
        $ErrorActionPreference = "Stop"
        # Edge is an MSI install, not MSIX, so Get-AppxPackage finds nothing.
        # The real .65 bits sit under the Edge Application dir; the 64-bit MSI
        # uses the x86 Program Files path. Take whichever dir actually holds a
        # msedge.exe.
        $edgeAppDir = @(
          "C:\Program Files (x86)\Microsoft\Edge\Application",
          "C:\Program Files\Microsoft\Edge\Application"
        ) | Where-Object { Test-Path (Join-Path $_ "msedge.exe") } |
          Select-Object -First 1
        if (-not $edgeAppDir) {
          throw "Could not find an installed msedge.exe under the Edge Application dirs"
        }
        $installedVersion = (Get-Item (Join-Path $edgeAppDir "msedge.exe")).VersionInfo.ProductVersion
        Write-Output "Installed Edge $installedVersion at $edgeAppDir"
        $copyDir = Join-Path $env:CI_PROJECT_DIR "edge-run-copy"
        robocopy $edgeAppDir $copyDir /E /NFL /NDL /NJH /NJS /NP
        # robocopy exit codes below 8 are success; 8+ are real failures.
        if ($LASTEXITCODE -ge 8) {
          throw "robocopy failed copying Edge (exit code $LASTEXITCODE)"
        }
        $global:LASTEXITCODE = 0
        $edgeBinary = Join-Path $copyDir "msedge.exe"
        if (-not (Test-Path $edgeBinary)) {
          throw "Copied Edge binary not found at $edgeBinary"
        }
        $copiedVersion = (Get-Item $edgeBinary).VersionInfo.ProductVersion
        if ($copiedVersion -ne $installedVersion) {
          throw "Copied Edge $copiedVersion does not match installed $installedVersion"
        }
        $env:EDGE_RUN_COPY = $edgeBinary
        Write-Output "EDGE_RUN_COPY=$edgeBinary ($copiedVersion)"
      } catch {
        # Write-Host, not Write-Error: under $ErrorActionPreference = "Stop"
        # Write-Error is itself terminating and would abort before exit 1,
        # letting the job go green without running the tests. Write-Host cannot
        # throw, so exit 1 always runs and the job fails red on a bad copy.
        Write-Host "Edge copy setup failed: $_"
        exit 1
      }
  tags:
    - eyeo-windows
  # We set a custom timeout here to allow for more time to run functional tests
  # in scheduled pipelines, as they can take longer than one hour.
  # Note that we cannot apply it ot the entire pipeline by adding it to the
  # "default" section: https://gitlab.com/gitlab-org/gitlab/-/issues/213634
  timeout: 2h

func:v2:windows:edge:
  extends: .functional-windows
  rules:
    - !reference [.nightly-run, rules]
  script:
    - npm run -w=@eyeo/webext-ad-filtering-solution test:functional "--" 2 edge latest --timeout=10000

# Functional tests - MV3
func:v3:chrome:latest:
  extends: .functional-n-times
  variables:
    BROWSER: chrome latest
    TEST_PARAMS: 3 $BROWSER --testKinds functional reload update

func:v3:chrome:incognito:
  extends: .functional-n-times
  variables:
    BROWSER: chrome latest
    TEST_PARAMS: 3 $BROWSER --testKinds functional reload update --incognito

func:v3:chromium:oldest:
  extends: .functional-n-times
  variables:
    BROWSER: chromium $OLDEST_CHROMIUM_MV3_VERSION
    TEST_PARAMS: 3 $BROWSER --testKinds functional reload update

func:v3:edge:latest:
  extends: .functional-n-times
  variables:
    BROWSER: edge latest
    TEST_PARAMS: 3 $BROWSER --testKinds functional reload update

func:v3:windows:edge:
  extends: .functional-windows
  script:
    - npm run -w=@eyeo/webext-ad-filtering-solution test:functional "--" 3 edge latest --timeout=10000 --testKinds functional reload update

# Functional tests - isolated
.functional-isolated:
  extends: .functional-nightly
  stage: test
  script:
    - docker run $DOCKER_OPTIONS -e TEST_SUITES="$TEST_SUITES" -e TEST_PARAMS="$TEST_PARAMS" --entrypoint "core/sdk/test/dockerfiles/isolated-entrypoint.sh" $FUNCTIONAL_IMAGE

.functional-isolated-mv3:
  extends: .functional-isolated
  variables:
    # > removes interior line-breaks
    # - removes the line-break at the end of TEST_SUITES
    TEST_SUITES: >-
      Initialization
      Console.logging
      Endpoint.manipulation
      Allowlisting
      Element.Hiding
      Snippets
      ^Blocking
      Notifications
      Reporting
      Subscriptions
      Filter.list.updates
      Subscription.events
      ^Filters
      Subscribe
      Pop-up.blocking
      MV3.Service.Workers
      Synchronization

.functional-isolated-mv2:
  extends: .functional-isolated
  variables:
    TEST_SUITES: >-
      Initialization
      Console.logging
      Endpoint.manipulation
      Allowlisting
      Element.Hiding
      Snippets
      ^Blocking
      Notifications
      Reporting
      Subscriptions
      Filter.list.updates
      Subscription.events
      ^Filters
      Subscribe
      Pop-up.blocking

fi:v3:chrome:latest:
  extends: .functional-isolated-mv3
  variables:
    TEST_PARAMS: 3 chrome latest

fi:v3:edge:latest:
  extends: .functional-isolated-mv3
  variables:
    TEST_PARAMS: 3 edge latest

fi:v2:firefox:
  extends: .functional-isolated-mv2
  variables:
    TEST_PARAMS: 2 firefox latest

# Functional tests - nightly run
.functional-nightly:
  extends: .functional
  rules:
    - !reference [.nightly-run, rules]

func:v3:chrome:beta:
  extends: .functional-nightly
  variables:
    BROWSER: chrome beta
    TEST_PARAMS: 3 $BROWSER --testKinds functional reload update

func:v2:edge:oldest:
  extends: .functional-nightly
  variables:
    BROWSER: edge $OLDEST_EDGE_MV2_VERSION
    TEST_PARAMS: 2 $BROWSER --testKinds functional reload

# Fuzz tests
.fuzz:
  extends: .functional
  stage: fuzz
  variables:
    TEST_PARAMS: 3 $BROWSER $INCOGNITO --testKinds fuzz

fuzz:v3:chrome:latest:
  extends:
    - .functional-nightly
    - .fuzz
  variables:
    BROWSER: chrome latest

fuzz:v3:chrome:incognito:
  extends:
    - .functional-nightly
    - .fuzz
  variables:
    BROWSER: chrome latest
    INCOGNITO: --incognito

fuzz:v3:edge:latest:
  extends:
    - .functional-nightly
    - .fuzz
  variables:
    BROWSER: edge latest

# Compliance tests
.compliance:
  stage: compliance
  extends: .docker-image
  needs:
    - !reference [.needs-parent-build, needs]
  before_script:
    - apk add bash git zip
  script:
    - TERMINAL="t" TESTS_TO_INCLUDE="filters/wildcard-domain,filters/remove,filters/remove-extended,filters/remove-on-DOM-mutation,filters/remove-extended-inversion,$MV3_ONLY_TESTS" ./core/sdk/test/scripts/compliance.sh
  after_script:
    - docker cp $(docker ps -aqf ancestor=$COMPLIANCE_IMAGE):/testpages.adblockplus.org/test/screenshots core/sdk/
  artifacts:
    paths:
      - core/sdk/screenshots/
    when: always
    expire_in: 1 day
  rules:
    - !reference [.main-run, rules]

comp:v2:firefox:
  extends: .compliance
  variables:
    VERSION: latest
    BROWSER: firefox
    MANIFEST: mv2

comp:v2:chromium:
  extends: .compliance
  variables:
    VERSION: $LATEST_CHROMIUM_MV2_VERSION
    BROWSER: chromium
    MANIFEST: mv2

comp:v3:chrome:
  extends: .compliance
  variables:
    VERSION: latest
    BROWSER: chrome
    MANIFEST: mv3
    MV3_ONLY_TESTS: exceptions/sitekey_mv3

comp:v3:edge:
  extends: .compliance
  variables:
    VERSION: latest
    BROWSER: edge
    MANIFEST: mv3
    MV3_ONLY_TESTS: exceptions/sitekey_mv3

# Integration tests
int:scripts:
  extends: .basic-image
  stage: integration
  script:
    - docker run $DOCKER_OPTIONS --entrypoint core/sdk/test/dockerfiles/integration-entrypoint.sh $BASIC_IMAGE
  rules:
    - !reference [.avoid-flaky-run, rules]

int:bundle:
  stage: integration
  script:
    - npm run -w=@eyeo/webext-ad-filtering-solution test:bundle
  needs:
    - !reference [.needs-parent-build, needs]
  rules:
    - !reference [.avoid-flaky-run, rules]

int:safari:
  extends: .macos-image
  stage: integration
  needs: ["build:safari"]
  before_script:
    - !reference [.macos-image, before_script]
    # /etc/hosts edit based on https://gitlab.com/eyeo/network-filtering/nasapp-testing/-/blob/main/scripts/setup-host.sh
    - asdf install java openjdk-22
    - asdf global java openjdk-22
    - grep -q "127.0.0.1 testpages.eyeo.com" /etc/hosts || echo "127.0.0.1 testpages.eyeo.com" | sudo tee -a /etc/hosts
    - npm install
  script:
    - ./core/sdk/test/scripts/safari.sh
  artifacts:
    paths:
      - core/sdk/nasapp-testing/test-output/screenshots/
    when: on_failure
    expire_in: 1 mo

# Performance tests
.performance:
  extends: .functional
  stage: performance
  script:
    - docker run $DOCKER_OPTIONS -e NODE_OPTIONS="--max-old-space-size=4096" --entrypoint npm $FUNCTIONAL_IMAGE run -w @eyeo/webext-ad-filtering-solution test:performance -- $PARAMS

perf:v3:chrome:
  extends: .performance
  variables:
    PARAMS: 3 chrome

perf:save-baseline:v3:chrome:
  extends: .performance
  after_script:
    - docker cp $(docker ps -aqf ancestor=$FUNCTIONAL_IMAGE | head -n 1):/extensions/core/sdk/test/performance/baseline_docker.json ./core/sdk/test/performance/baseline_docker.json
  artifacts:
    paths:
      - core/sdk/test/performance/baseline_docker.json
    when: on_success
    expire_in: 1 day
  variables:
    PARAMS: 3 chrome --saveBaseline
  rules:
    - if: $SAVE_BASELINE == "true"
