<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 400px;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    /* Tabs */
    .tabs {
      display: flex;
      width: 100%;
      border-bottom: 1px solid #e0e0e0;
      background: #fafafa;
    }
    .tab {
      flex: 1 1 0;
      min-width: 0;
      padding: 10px 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      text-align: center;
    }
    .tab:hover {
      color: #333;
      background: #f0f0f0;
    }
    .tab.active {
      color: #007aff;
      border-bottom-color: #007aff;
    }

    /* Shared toolbar styles */
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Shared button styles */
    .btn {
      padding: 6px 12px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #f5f5f5;
    }
    .btn:active {
      background: #eee;
    }
    .btn-primary {
      background: #007aff;
      border-color: #007aff;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0066d6;
    }
    .btn-primary:active {
      background: #0055b3;
    }
    .btn-danger {
      color: #ff3b30;
      border-color: #ff3b30;
    }
    .btn-danger:hover {
      background: #fff5f5;
    }

    /* Shared select styles */
    .select {
      padding: 6px 8px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Shared input styles */
    .input {
      padding: 6px 8px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 4px;
      font-size: 12px;
    }
    .input:focus {
      outline: none;
      border-color: #007aff;
    }
    .input::placeholder {
      color: #999;
    }

    /* Tab content */
    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      width: 100%;
    }
    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    /* Subscriptions */
    .subscriptions-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      flex: 1;
    }
    .metrics-section {
      background: #f0f7ff;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      font-family: "SF Mono", Monaco, Consolas, monospace;
    }
    .metrics-section:empty {
      display: none;
    }
    .metrics-section h4 {
      margin: 0 0 8px 0;
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .metrics-table {
      width: 100%;
      border-collapse: collapse;
    }
    .metrics-table th,
    .metrics-table td {
      text-align: left;
      padding: 4px 6px;
      border-bottom: 1px solid #dde8f3;
    }
    .metrics-table th {
      color: #666;
      font-weight: 500;
    }
    .metrics-table td {
      color: #333;
    }
    .metrics-table .value {
      color: #007aff;
      font-weight: 500;
    }
    .metrics-table .downloading {
      color: #ff9500;
    }
    .metrics-table .total-row {
      border-top: 2px solid #007aff;
      font-weight: 600;
    }
    .metrics-table .total-row td {
      color: #007aff;
    }
    .subscription-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .subscription-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      width: 100%;
    }
    .subscription-info {
      flex: 1;
      margin-right: 12px;
    }
    .subscription-title {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 2px;
    }
    .subscription-type {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    .toggle input:checked + .toggle-slider {
      background-color: #34c759;
    }
    .toggle input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }
    .toggle input:disabled + .toggle-slider {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Logs */
    .logs-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      flex: 1;
    }
    .logs {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      overflow-y: auto;
      min-height: 250px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-entry {
      margin: 2px 0;
      line-height: 1.4;
    }
    .log-entry.info { color: #9cdcfe; }
    .log-entry.warn { color: #dcdcaa; }
    .log-entry.error { color: #f48771; }
    .log-entry.debug { color: #b5cea8; }
    .log-entry.hidden { display: none; }
    .log-session-separator {
      background: #ff3b30;
      color: #fff;
      font-weight: 600;
      text-align: center;
      padding: 6px 12px;
      margin: 8px 0;
      border-radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Debug info */
    .debug-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      flex: 1;
    }
    .debug-section {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
    }
    .debug-section h3,
    .debug-section h4,
    .metrics-section h4 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .debug-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
    }
    .debug-label {
      color: #666;
    }
    .debug-value {
      color: #333;
      font-weight: 500;
    }

    /* States */
    .loading {
      text-align: center;
      padding: 20px;
      color: #888;
    }
    .error {
      color: #ff3b30;
      padding: 12px;
      background: #ffebee;
      border-radius: 8px;
      font-size: 13px;
    }
    .empty {
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tab="debug">Debug</button>
    <button class="tab" data-tab="subscriptions">Subscriptions</button>
    <button class="tab" data-tab="logs">Logs</button>
  </div>

  <div id="debug" class="tab-content active">
    <div class="debug-info">
      <div class="toolbar">
        <button id="refreshDebug" class="btn">Refresh</button>
      </div>
      <div id="startupSection" class="debug-section"></div>
      <div id="metricsSection" class="metrics-section"></div>
    </div>
  </div>

  <div id="subscriptions" class="tab-content">
    <div class="subscriptions-container">
      <div class="toolbar">
        <button id="refreshSubscriptions" class="btn">Refresh</button>
      </div>
      <div id="subscriptionContent" class="loading">Loading subscriptions...</div>
    </div>
  </div>

  <div id="logs" class="tab-content">
    <div class="logs-container">
      <div class="toolbar">
        <button id="clearLogs" class="btn btn-danger">Clear</button>
        <button id="refreshLogs" class="btn">Refresh</button>
        <button id="copyLogs" class="btn">Copy</button>
      </div>
      <div class="toolbar">
        <select id="logLevelFilter" class="select">
          <option value="all">All levels</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
          <option value="debug">Debug</option>
        </select>
        <input type="text" id="logTextFilter" class="input" placeholder="Filter..." style="flex: 1; min-width: 0;">
      </div>
      <div id="logsContent" class="logs"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
