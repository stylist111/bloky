spec:
  inputs:
    job_runs:
      type: number
      default: 1
      description: Amount of times certain test jobs should run using the "parallel" keyword
---
include: "/.gitlab/ci-common.yml"

default:
  interruptible: true
  tags:
    - "GCP"

.docker:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - !reference [.needs-parent-build, needs]

stages:
  - test

.functional:
  stage: test
  extends: .docker
  script:
    - docker build -t fragments -f fragment/test/Dockerfile .
    - docker run --shm-size=2g -t -e BROWSER -e BROWSER_VERSION -e MANIFEST_VERSION -e CI fragments
  after_script:
    - IMAGE_ID=$(docker ps -aqf ancestor=fragments)
    - docker cp $IMAGE_ID:/extensions/fragment/test/screenshots fragment/ 2> /dev/null
  artifacts:
    paths:
      - fragment/screenshots/
    when: on_failure
    expire_in: 1 mo

.functional-n-times:
  extends: .functional
  parallel: $[[ inputs.job_runs ]]

functional:MV2:firefox:latest:
  extends: .functional-n-times
  variables:
    BROWSER: firefox
    MANIFEST_VERSION: 2

functional:MV3:edge:latest:
  extends: .functional-n-times
  variables:
    BROWSER: edge
    MANIFEST_VERSION: 3

functional:MV3:chrome:latest:
  extends: .functional-n-times
  variables:
    BROWSER: chrome
    MANIFEST_VERSION: 3

# Fragments tests - nightly run
.functional-nightly:
  extends: .functional
  rules:
    - !reference [.nightly-run, rules]

functional:MV2:firefox:beta:
  extends: .functional-nightly
  variables:
    MANIFEST_VERSION: 2
    BROWSER: firefox
    BROWSER_VERSION: beta

functional:MV3:chrome:beta:
  extends: .functional-nightly
  variables:
    MANIFEST_VERSION: 3
    BROWSER: chrome
    BROWSER_VERSION: beta
