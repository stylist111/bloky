default:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node12-no-python
  interruptible: true

stages:
  - build
  - test

variables:
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"

cache:
  paths:
    - node_modules/
    - test/*-snapshots/download-cache/

build:
  stage: build
  script:
    - npm install
    - npm run lint
    - npm run build -- --env release
    - npm run docs
    - npm run test-bundle
  artifacts:
    paths:
      - dist/
      - docs/
    exclude:
      - dist/package.json
    expire_in: 1 month

.test:
  stage: test
  before_script:
    - npm install
    - npm run test-server &
  needs:
    - job: build
      artifacts: true

test:v2:chromium:stable:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium

test:v2:chromium:oldest:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium 77.0.3865.0

test:v2:chromium:beta:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium beta

test:v2:chromium:dev:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium dev

test:v2:firefox:latest:
  extends: .test
  script:
    - npm test -- v2 firefox

test:v2:firefox:oldest:
  extends: .test
  script:
    - npm test -- v2 firefox 68.0
  # https://gitlab.com/eyeo/adblockplus/webext-sdk/-/issues/50
  retry: 2

test:v2:firefox:beta:
  extends: .test
  script:
    - npm test -- v2 firefox beta

test:v2:edge:
  extends: .test
  variables:
    NODE_OPTIONS: --experimental-modules
  before_script:
    - Invoke-WebRequest
        -Uri "${Env:CI_API_V4_URL}/projects/${Env:CI_PROJECT_ID}/packages/generic/microsoft-edge/79.0.309/MicrosoftEdgeEnterpriseX64.msi"
        -Headers @{'JOB-TOKEN' = $Env:CI_JOB_TOKEN}
        -OutFile 'MicrosoftEdgeEnterpriseX64.msi'
    - Start-Process msiexec
        -ArgumentList "/i MicrosoftEdgeEnterpriseX64.msi /norestart /qn" -Wait
    - npm install
    - Start-Process "node" -ArgumentList "test/start-server.js" -PassThru
  script:
    - npm test -- v2 edge --timeout=15000
  tags:
    - shared-windows
    - windows
    - windows-1809
  cache: {}

test:v3:chromium:stable:
  extends: .test
  script:
    - xvfb-run -a npm test -- v3 chromium
  allow_failure: true
