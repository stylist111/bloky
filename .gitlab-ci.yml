default:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node12-no-python
  interruptible: true

stages:
  - build
  - test

variables:
  GIT_SUBMODULE_STRATEGY: "recursive"
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"

cache:
  paths:
    - node_modules/
    - adblockpluscore/*-snapshots/download-cache/
    - adblockpluscore/chromium-snapshots/chromedriver/

build:
  stage: build
  script:
    - npm install
    - npm run lint
    - npm run bundle -- --env release
    - npm run docs
  artifacts:
    paths:
      - dist/
      - docs/
    expire_in: 1 month

.test:
  stage: test
  before_script:
    - npm install
    - node test/start-server.js &
  needs:
    - job: build
      artifacts: true

test:chromium:latest:
  extends: .test
  script:
    - xvfb-run -a node test/runner.js chromium

test:chromium:oldest:
  extends: .test
  script:
    - xvfb-run -a node test/runner.js chromium 77.0.3865.0

test:firefox:latest:
  extends: .test
  script:
    - node test/runner.js firefox

test:firefox:oldest:
  extends: .test
  script:
    - node test/runner.js firefox 63.0

test:edge:
  extends: .test
  variables:
    NODE_OPTIONS: --experimental-modules
  before_script:
    - choco install -y microsoft-edge --version=79.0.309.71
    - npm install
  script:
    - $server_process = (Start-Process -NoNewWindow "node" -ArgumentList "test/start-server.js" -PassThru)
    - $test_process = (Start-Process -NoNewWindow "node" -ArgumentList "test/runner.js edge" -PassThru -Wait)
    - Stop-Process $server_process.Id -Force -PassThru
    - Exit($test_process.ExitCode)
  tags:
    - shared-windows
    - windows
    - windows-1809
  cache: {}
