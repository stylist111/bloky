default:
  interruptible: true

variables:
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"
  RUN_ONLY_FLAKY_TESTS: "false"

  # Browser versions we use:
  LATEST_CHROME_VERSION: 111.0.5563.64
  OLDEST_CHROME_VERSION: 77.0.3865.0
  LATEST_FIREFOX_VERSION: "110.0"
  OLDEST_FIREFOX_VERSION: "68.0"
  LATEST_EDGE_VERSION: 111.0.1661.41
  # until we use shared runners, this is default value
  LATEST_EDGE_WINDOWS_VERSION:  79.0.309

# Jobs marked with that rule won't be triggered on pipelines for flaky
# debugging
.avoid-flaky-run:
  rules:
    # Run when "full" is specified because this is for nightly runs
    - if: $FULL == 'true'
      when: always
    # Do not trigger a merge request pipeline
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
     # Don't run automatically on commit that contains flaky 
     # or is pipeline that checks tests quality
    - if: $CHECKTESTS == 'true'
      when: manual
    - if: $CI_COMMIT_MESSAGE =~ /\[flaky]/
      when: manual
    # Run automatically if other conditions not filled
    - when: always

# Used for jobs that will be included only in full set of tests
.all-browsers-test-run:
  rules:
    # Do not trigger a merge request pipeline
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Run full set when FULL is true
    - if: $FULL == 'true'

.docker-image:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind

stages:
  - build
  - pages
  - unit
  - test
  - functional
  - fuzz
  - compliance
  - integration

build:
  image: node:18-bullseye-slim
  stage: build
  before_script:
    - npm install
  script:
    - npm run build
    - DOCS_ERROR=$(npm run docs 2>&1 >/dev/null) && if [ ! -z "$DOCS_ERROR" ]; then echo $DOCS_ERROR && false; fi
    - npm run docs-core
  artifacts:
    paths:
      - dist/
      - dist/docs
    expire_in: 1 week

audit:
  image: node:18-bullseye-slim
  stage: build
  before_script:
    - npm install
  script:
    - npm audit --production
  allow_failure: true
  rules:
    - !reference [.avoid-flaky-run, rules]

lint:
  image: node:18-bullseye-slim
  stage: build
  before_script:
    - npm install
  script:
    - npm run lint

# Unit tests

.unit:
  image: registry.gitlab.com/eyeo/docker/get-browser-binary:node18
  stage: unit
  needs: []
  before_script:
    - npm install
  rules:
    - !reference [.avoid-flaky-run, rules]

unit:core:
  extends: .unit
  script:
    - npm run test-core
    - npm run -w core test:dist

unit:benchmark:core:
  extends: .unit
  script:
    - npm run -w core benchmark
    - npm run -w core benchmark:save
    - npm run -w core benchmark:compare

unit:webext:
  extends: .unit
  script:
    - npm run unittest

# Functional Tests

func:scripts:
  image: node:18-bullseye-slim
  stage: functional
  needs: []
  before_script:
    - npm install
  script:
    - npm run test-scripts
  rules:
    - !reference [.avoid-flaky-run, rules]

func:bundle:
  image: node:18-bullseye-slim
  stage: functional
  script:
    - npm run test-bundle
  needs:
    - job: build
      artifacts: true
  rules:
    - !reference [.avoid-flaky-run, rules]

.functional:
  stage: functional
  timeout: 2 hours
  extends: .docker-image
  needs:
    - job: build
      artifacts: true
  script:
        if [ -z "${CI_COMMIT_MESSAGE##*"[flaky]"*}" ]; then
          echo "Commit message contains [flaky] tag!";
          RUN_ONLY_FLAKY_TESTS=true;
        else
          RUN_ONLY_FLAKY_TESTS=false;
        fi;
        if echo "$CHECKTESTS" | grep -q "true"; then
          apk --update add nodejs npm;
          npm install -g npm@latest;
          npm install;
          npm run measureTestFlakiness -- --testParams "$TEST_PARAMS" --buildFlags "SKIP_BUILD=1" --runOnlyFlaky "$RUN_ONLY_FLAKY_TESTS" --runs 10;
        else
          docker build -t functional -f test/dockerfiles/functional.Dockerfile --build-arg BROWSER="$BROWSER" --build-arg SKIP_BUILD=1 .;
          docker run --cpus=2 --memory=8g --shm-size=512m -e TEST_PARAMS="$TEST_PARAMS" -e RUN_ONLY_FLAKY="$RUN_ONLY_FLAKY_TESTS"  --name functional functional;
          docker inspect functional | grep -i shm;
          docker inspect functional | grep -i Memory;

        fi

func:v2:chromium:stable:
  extends: .functional
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    TEST_PARAMS: v2 $BROWSER

func:v2:chromium:stable:incognito:
  extends: .functional
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    TEST_PARAMS: v2 $BROWSER --incognito

func:v2-subs:chromium:stable:
  extends: .functional
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    TEST_PARAMS: v2-custom $BROWSER

func:v2:chromium:oldest:
  extends: .functional
  variables:
    BROWSER: chromium $OLDEST_CHROME_VERSION
    TEST_PARAMS: v2 $BROWSER

func:v2:firefox:stable:
  extends: .functional
  variables:
    BROWSER: firefox $LATEST_FIREFOX_VERSION
    TEST_PARAMS: v2 $BROWSER

func:v2:firefox:incognito:
  extends: .functional
  variables:
    BROWSER: firefox $LATEST_FIREFOX_VERSION
    TEST_PARAMS: v2 $BROWSER --incognito

func:v2:firefox:oldest:
  extends: .functional
  variables:
    BROWSER: firefox $OLDEST_FIREFOX_VERSION
    TEST_PARAMS: v2 $BROWSER

# https://gitlab.com/eyeo/adblockplus/abc/webext-ad-filtering-solution/-/issues/369
func:v2:firefox:update:incognito:
  extends: .functional
  variables:
    BROWSER: firefox $LATEST_FIREFOX_VERSION
    TEST_PARAMS: v2 $BROWSER --testKinds update --incognito

.func:v2:windows:edge:
  stage: functional
  needs:
    - job: build
      artifacts: true
  variables:
    CI_PROJECT_ID_MAINSTREAM: 22365241
  before_script:
    - Invoke-WebRequest
        -Uri "${Env:CI_API_V4_URL}/projects/${Env:CI_PROJECT_ID_MAINSTREAM}/packages/generic/microsoft-edge/79.0.309/MicrosoftEdgeEnterpriseX64.msi"
        -Headers @{'JOB-TOKEN' = $Env:CI_JOB_TOKEN}
        -OutFile 'MicrosoftEdgeEnterpriseX64.msi'
    - Start-Process msiexec
        -ArgumentList "/i MicrosoftEdgeEnterpriseX64.msi /norestart /qn" -Wait
    - choco upgrade -y --no-progress nodejs --version 18.17.1
    - npm install
  tags:
    - shared-windows
    - windows
    - windows-1809

func:v2:windows:edge:stable:
  extends: .func:v2:windows:edge
  script:
    - npm test v2 edge -- $LATEST_EDGE_WINDOWS_VERSION --timeout=10000

func:v2:windows:edge:incognito:
  extends: .func:v2:windows:edge
  script:
    - npm test v2 edge -- $LATEST_EDGE_WINDOWS_VERSION --incognito --timeout=10000

# Functional MV3 tests

func:v3:chromium:stable:
  extends: .functional
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

func:v3:chromium:stable:incognito:
  extends: .functional
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update --incognito

func:v3:edge:linux:
  extends: .functional
  variables:
    BROWSER: edge $LATEST_EDGE_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

# This jobs will run only on "check tests quality" pipelines and jobs will ALWAYS
# run all tests regardless of FLAKY tags
.functional-isolated:
  extends: .functional
  stage: test
  script:
    - docker build -t functional -f test/dockerfiles/functional.Dockerfile --build-arg BROWSER="$BROWSER" --build-arg SKIP_BUILD=1 .
    - docker run --cpus=2 --memory=8g --shm-size=512m --memory-swap=16384m --shm-size=512m -e TEST_PARAMS="$TEST_PARAMS --grep $FUNCTIONAL_MODULE" functional;
  parallel:
    matrix:
      - FUNCTIONAL_MODULE:
        - "Initialization"
        - "MV3\\sService\\sWorkers"
        - "Console\\slogging"
        - "Endpoint\\smanipulation"
        - "Allowlisting"
        - "Element\\sHiding"
        - "Snippets"
        - "Notifications"
        - "^Blocking"
        - "Reporting"
        - "Subscriptions"
        - "Filter\\slist\\supdates"
        - "Subscription\\sevents"
        - "^Filters"
        - "Synchronization"
        - "Subscribe"
        - "Pop-up\\sblocking"
  rules:
    # Do not trigger a merge request pipeline
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        when: never
      - if: $CHECKTESTS == 'true'
        when: always
    # Do not trigger on other pipelines
      - when: never

testquality:v3:chromium:stable:
  extends: .functional-isolated
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional 

testquality:v3:edge:linux:
  extends: .functional-isolated
  variables:
    BROWSER: edge $LATEST_EDGE_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional

testquality:v2:firefox:
  extends: .functional-isolated
  variables:
    BROWSER: firefox $LATEST_FIREFOX_VERSION
    TEST_PARAMS: v2 $BROWSER --testKinds functional

# This jobs will be run on nightly runs of the pipeline or when triggered with "FULL" variable
.functional-full:
  extends: .functional
  allow_failure: true
  rules:
    - !reference [.all-browsers-test-run, rules]
  
func:v2:chromium:latest:
  extends: .functional-full
  variables:
    BROWSER: chromium
    TEST_PARAMS: v2 $BROWSER --testKinds functional reload update

func:v3:chromium:latest:
  extends: .functional-full
  variables:
    BROWSER: chromium
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

func:v2:firefox:latest:
  extends: .functional-full
  variables:
    BROWSER: firefox
    TEST_PARAMS: v2 $BROWSER --testKinds functional reload update
    
func:v2:firefox:latest:update:incognito:
  extends: .functional
  variables:
    BROWSER: firefox
    TEST_PARAMS: v2 $BROWSER --testKinds update --incognito

func:v2:edge:linux:latest:
  extends: .functional-full
  variables:
    BROWSER: edge
    TEST_PARAMS: v2 $BROWSER --testKinds functional reload update

func:v3:edge:linux:latest:
  extends: .functional-full
  variables:
    BROWSER: edge
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

# Fuzz tests

.fuzz:
  extends: .functional
  timeout: 4 hours 30 minutes
  stage: fuzz
  script:
       if [ -z "${CI_COMMIT_MESSAGE##*"[flaky]"*}" ]; then
          echo "Commit message contains [flaky] tag!";
          RUN_ONLY_FLAKY_TESTS=true;
        else
          RUN_ONLY_FLAKY_TESTS=false;
        fi;
        if echo "$CHECKTESTS" | grep -q "true"; then
          apk --update add nodejs npm;
          npm install -g npm@latest;
          npm install;
          npm run measureTestFlakiness -- --testParams "v3 $BROWSER --testKinds fuzz" --buildFlags "SKIP_BUILD=1" --runOnlyFlaky "$RUN_ONLY_FLAKY_TESTS";
        else
          docker build -t functional -f test/dockerfiles/functional.Dockerfile --build-arg SKIP_BUILD=1 .;
          docker run --cpus=2 --memory=8g --shm-size=512m -e TEST_PARAMS="v3 $BROWSER --testKinds fuzz" -e RUN_ONLY_FLAKY="$RUN_ONLY_FLAKY_TESTS" --name functional functional;
          docker inspect functional | grep -i shm;
          docker inspect functional | grep -i Memory;
        fi

fuzz:v3:chromium:stable:
  extends: .fuzz
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    TEST_PARAMS: $BROWSER

fuzz:v3:chromium:stable:incognito:
  extends: .fuzz
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    TEST_PARAMS: $BROWSER  --incognito
  rules:
    - !reference [.all-browsers-test-run, rules]

# Fuzz tests is running on Edge 108 only so we don't need to increase timeout
fuzz:v3:edge:linux:
  extends: .fuzz
  variables:
    BROWSER: edge $LATEST_EDGE_VERSION
    TEST_PARAMS: $BROWSER
  rules:
    - !reference [.all-browsers-test-run, rules]

.compliance:
  stage: compliance
  extends: .docker-image
  needs:
    - job: build
      artifacts: true
  script:
    - docker build -t compliance -f test/dockerfiles/compliance-test.Dockerfile --build-arg EXTENSION=copy .
    - docker run --cpus=2 --memory=8g --shm-size=512m -e BROWSER="$BROWSER" -e MANIFEST="$MANIFEST" compliance
  after_script:
    - docker cp $(docker ps -aqf ancestor=compliance):/testpages.adblockplus.org/test/screenshots .
      2> /dev/null
  artifacts:
    paths:
      - screenshots/
    when: always
    expire_in: 1 day
  rules:
    # Do not trigger a merge request pipeline
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Run full set when FULL is true
    - if: $FULL == 'true'
    - if: $CI_COMMIT_BRANCH == "master"

compliance:v2:firefox:
  extends: .compliance
  variables:
    BROWSER: firefox $LATEST_FIREFOX_VERSION
    MANIFEST: mv2

compliance:v2:chromium:
  extends: .compliance
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    MANIFEST: mv2
    
compliance:v3:chromium:
  extends: .compliance
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION
    MANIFEST: mv3

compliance:v3:edge:
  extends: .compliance
  variables:
    BROWSER: edge $LATEST_EDGE_VERSION
    MANIFEST: mv3

int:scripts:
  image: node:18-bullseye-slim
  needs: []
  stage: integration
  before_script:
    - npm install --production
  script:
    - cd test/scripts/test-extension
    - npm install
    - npm exec subs-init
    - npm exec subs-merge
    - npm exec subs-fetch
    - npm exec subs-convert -- -r
    - npm exec subs-generate
  rules:
    - !reference [.avoid-flaky-run, rules]

.pages:
  image: node:18-bullseye-slim
  stage: pages
  dependencies:
    - build

include:
  - ".gitlab-pages.yml"
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Code-Quality.gitlab-ci.yml
