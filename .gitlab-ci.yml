default:
  interruptible: true

variables:
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"

  # Browser versions we use:
  STABLE_CHROMIUM_VERSION: "120.0.6099.71"
  OLDEST_CHROMIUM_MV2_VERSION: "77.0.3865.0"
  OLDEST_CHROMIUM_MV3_VERSION: "111.0.5563.64"
  STABLE_FIREFOX_VERSION: "120.0.1"
  STABLE_FIREFOX_BSL_INCOGNITO_VERSION: "114.0.2"
  OLDEST_FIREFOX_VERSION: "68.0"
  STABLE_EDGE_VERSION: "120.0.2210.61"
  # Default value for Windows shared runners
  STABLE_EDGE_WINDOWS_VERSION: "79.0.309"

# Pipeline rules
workflow:
  rules:
    # Do not trigger merge request pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

# The following CI variables modify which jobs run in a pipeline:
# - FULL: Full set of tests, including latest browsers. Used in nightly runs.
# - CHECKTESTS: Check tests quality. Used in nightly runs.

.full-run:
  rules:
    - if: $FULL == "true"

.checktests-run:
  rules:
    - if: $CHECKTESTS == "true"

.master-run:
  rules:
    - !reference [.full-run, rules]
    - if: $CI_COMMIT_BRANCH == "master"

# Won't be triggered on flaky debugging pipelines
.avoid-flaky-run:
  rules:
    - !reference [.full-run, rules]
    # Run manually on commits that contain [flaky] or checktests pipelines
    - if: $CHECKTESTS == "true"
      when: manual
    - if: $CI_COMMIT_MESSAGE =~ /\[flaky]/
      when: manual
    # Run automatically if other conditions not filled
    - when: always

.docker-image:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind

stages:
  - build
  - pages
  - unit
  - test
  - benchmark
  - functional
  - fuzz
  - compliance
  - integration

build:
  image: node:18-bullseye-slim
  stage: build
  before_script:
    - npm install
  script:
    - npm run build
    - DOCS_ERROR=$(npm run docs 2>&1 >/dev/null) && if [ ! -z "$DOCS_ERROR" ]; then echo $DOCS_ERROR && false; fi
    - npm run docs-core
  artifacts:
    paths:
      - dist/
      - dist/docs
    expire_in: 1 week

audit:
  image: node:18-bullseye-slim
  stage: build
  before_script:
    - npm install
  script:
    - npm audit --omit=dev
  allow_failure: true
  rules:
    - !reference [.avoid-flaky-run, rules]

lint:
  image: node:18-bullseye-slim
  stage: build
  before_script:
    - npm install
  script:
    - npm run lint

# Unit tests
.unit:
  stage: unit
  needs: []
  rules:
    - !reference [.avoid-flaky-run, rules]

unit:core:
  extends:
    - .unit
    - .docker-image
  script:
    - docker build -t core -f test/dockerfiles/core.Dockerfile .
    - docker run --cpus=2 --memory=8g --shm-size=512m -e CHROMIUM_VERSION="$STABLE_CHROMIUM_VERSION" -e FIREFOX_VERSION="$STABLE_FIREFOX_VERSION" -t core

unit:webext:
  image: node:18-bullseye-slim
  extends: .unit
  before_script:
    - npm install
  script:
    - npm run unittest

unit:scripts:
  image: node:18-bullseye-slim
  extends: .unit
  before_script:
    - npm install
  script:
    - npm run test-scripts

# Benchmark
benchmark:
  extends: .docker-image
  stage: benchmark
  needs: []
  script:
    - docker build -t benchmark -f test/dockerfiles/benchmark.Dockerfile .
    - docker run --cpus=2 --memory=8g --shm-size=512m benchmark
  rules:
    - !reference [.full-run, rules]

# Functional Tests
.functional:
  stage: functional
  timeout: 2 hours
  extends: .docker-image
  needs:
    - job: build
      artifacts: true
  script:
    COMMIT_FIRST_LINE=$(echo "$CI_COMMIT_MESSAGE" | head -1);
    if [ -z "${COMMIT_FIRST_LINE##*"[flaky]"*}" ]; then
      echo "The first line of the commit message contains the [flaky] tag!";
      OTHER_PARAMS="-e ONLY_FLAKY=true";
    fi;
    if echo "$CHECKTESTS" | grep -q "true"; then
      OTHER_PARAMS="$OTHER_PARAMS -e TEST_RUNS=10";
    fi;
    docker build -t functional -f test/dockerfiles/functional.Dockerfile --build-arg BROWSER="$BROWSER" --build-arg SKIP_BUILD=1 .;
    docker run --cpus=2 --memory=8g --shm-size=1g -e TEST_PARAMS="$TEST_PARAMS" $OTHER_PARAMS functional;

# Functional tests - MV2
func:v2:chromium:stable:
  extends: .functional
  variables:
    BROWSER: chromium $STABLE_CHROMIUM_VERSION
    TEST_PARAMS: v2 $BROWSER

func:v2:chromium:incognito:
  extends: .functional
  variables:
    BROWSER: chromium $STABLE_CHROMIUM_VERSION
    TEST_PARAMS: v2 $BROWSER --incognito

func:v2-subs:chromium:stable:
  extends: .functional
  variables:
    BROWSER: chromium $STABLE_CHROMIUM_VERSION
    TEST_PARAMS: v2-custom $BROWSER

func:v2:chromium:oldest:
  extends: .functional
  variables:
    BROWSER: chromium $OLDEST_CHROMIUM_MV2_VERSION
    TEST_PARAMS: v2 $BROWSER

func:v2:firefox:stable:
  extends: .functional
  variables:
    BROWSER: firefox $STABLE_FIREFOX_VERSION
    TEST_PARAMS: v2 $BROWSER

func:v2:firefox:incognito:
  extends: .functional
  variables:
    BROWSER: firefox $STABLE_FIREFOX_VERSION
    TEST_PARAMS: v2 $BROWSER --incognito

func:v2:firefox:oldest:
  extends: .functional
  variables:
    BROWSER: firefox $OLDEST_FIREFOX_VERSION
    TEST_PARAMS: v2 $BROWSER

.functional-windows:
  stage: functional
  needs:
    - job: build
      artifacts: true
  variables:
    CI_PROJECT_ID_MAINSTREAM: 22365241
  before_script:
    - Invoke-WebRequest
        -Uri "${Env:CI_API_V4_URL}/projects/${Env:CI_PROJECT_ID_MAINSTREAM}/packages/generic/microsoft-edge/79.0.309/MicrosoftEdgeEnterpriseX64.msi"
        -Headers @{'JOB-TOKEN' = $Env:CI_JOB_TOKEN}
        -OutFile 'MicrosoftEdgeEnterpriseX64.msi'
    - Start-Process msiexec
        -ArgumentList "/i MicrosoftEdgeEnterpriseX64.msi /norestart /qn" -Wait
    - choco upgrade -y --no-progress nodejs --version 18.17.1
    - npm install
  tags:
    - shared-windows
    - windows
    - windows-1809

func:v2:windows:edge:stable:
  extends: .functional-windows
  script:
    - npm test v2 edge -- $STABLE_EDGE_WINDOWS_VERSION --timeout=10000

func:v2:windows:edge:incognito:
  extends: .functional-windows
  script:
    - npm test v2 edge -- $STABLE_EDGE_WINDOWS_VERSION --incognito --timeout=10000

# Functional tests - MV3
func:v3:chromium:stable:
  extends: .functional
  variables:
    BROWSER: chromium $STABLE_CHROMIUM_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

func:v3:chromium:incognito:
  extends: .functional
  variables:
    BROWSER: chromium $STABLE_CHROMIUM_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update --incognito

func:v3:chromium:oldest:
  extends: .functional
  variables:
    BROWSER: chromium $OLDEST_CHROMIUM_MV3_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

func:v3:edge:stable:
  extends: .functional
  variables:
    BROWSER: edge $STABLE_EDGE_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

# Functional tests - isolated
.functional-isolated:
  extends: .functional
  stage: test
  script:
    - docker build -t functional -f test/dockerfiles/functional.Dockerfile --build-arg BROWSER="$BROWSER" --build-arg SKIP_BUILD=1 .
    - docker run --cpus=2 --memory=8g --shm-size=1g --memory-swap=16384m -e TEST_PARAMS="$TEST_PARAMS --grep $FUNCTIONAL_MODULE" functional
  rules:
    - !reference [.checktests-run, rules]

.functional-isolated-mv3:
  extends: .functional-isolated  
  parallel:
    matrix:
      - FUNCTIONAL_MODULE:
        - "Initialization"
        - "Console.logging"
        - "Endpoint.manipulation"
        - "Allowlisting"
        - "Element.Hiding"
        - "Snippets"
        - "Notifications"
        - "^Blocking"
        - "Reporting"
        - "Subscriptions"
        - "Filter.list.updates"
        - "Subscription.events"
        - "^Filters"
        - "Subscribe"
        - "Pop-up.blocking"
        # The jobs below only run in MV3
        - "MV3.Service.Workers"
        - "Synchronization"

.functional-isolated-mv2:
  extends: .functional-isolated  
  parallel:
    matrix:
      - FUNCTIONAL_MODULE:
        - "Initialization"        
        - "Console.logging"
        - "Endpoint.manipulation"
        - "Allowlisting"
        - "Element.Hiding"
        - "Snippets"
        - "Notifications"
        - "^Blocking"
        - "Reporting"
        - "Subscriptions"
        - "Filter.list.updates"
        - "Subscription.events"
        - "^Filters"        
        - "Subscribe"
        - "Pop-up.blocking"

fi:v3:chromium:stable:
  extends: .functional-isolated-mv3
  variables:
    BROWSER: chromium $STABLE_CHROMIUM_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional 

fi:v3:edge:stable:
  extends: .functional-isolated-mv3
  variables:
    BROWSER: edge $STABLE_EDGE_VERSION
    TEST_PARAMS: v3 $BROWSER --testKinds functional

fi:v2:firefox:
  extends: .functional-isolated-mv2
  variables:
    BROWSER: firefox $STABLE_FIREFOX_VERSION
    TEST_PARAMS: v2 $BROWSER --testKinds functional

# Functional tests - full run
.functional-full:
  extends: .functional
  allow_failure: true
  rules:
    - !reference [.full-run, rules]
  
func:v2:chromium:latest:
  extends: .functional-full
  variables:
    BROWSER: chromium
    TEST_PARAMS: v2 $BROWSER --testKinds functional reload

func:v2:chromium:beta:
  extends: .functional-full
  variables:
    BROWSER: chromium beta
    TEST_PARAMS: v2 $BROWSER --testKinds functional reload

func:v3:chromium:latest:
  extends: .functional-full
  variables:
    BROWSER: chromium
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

func:v3:chromium:beta:
  extends: .functional-full
  variables:
    BROWSER: chromium beta
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

func:v2:firefox:latest:
  extends: .functional-full
  variables:
    BROWSER: firefox
    TEST_PARAMS: v2 $BROWSER --testKinds functional reload

func:v2:firefox:incognito:update:
  extends: .functional-full
  variables:
    BROWSER: firefox $STABLE_FIREFOX_BSL_INCOGNITO_VERSION
    TEST_PARAMS: v2 $BROWSER --testKinds update --incognito
  allow_failure: false

func:v2:edge:latest:
  extends: .functional-full
  variables:
    BROWSER: edge
    TEST_PARAMS: v2 $BROWSER --testKinds functional reload

func:v3:edge:latest:
  extends: .functional-full
  variables:
    BROWSER: edge
    TEST_PARAMS: v3 $BROWSER --testKinds functional reload update

# Fuzz tests
.fuzz:
  extends: .functional
  timeout: 4 hours 30 minutes
  stage: fuzz
  variables:
    TEST_PARAMS: v3 $BROWSER $INCOGNITO --testKinds fuzz

fuzz:v3:chromium:stable:
  extends: .fuzz
  variables:
    BROWSER: chromium $STABLE_CHROMIUM_VERSION

fuzz:v3:chromium:incognito:
  extends: .fuzz
  variables:
    BROWSER: chromium $STABLE_CHROMIUM_VERSION
    INCOGNITO: --incognito
  rules:
    - !reference [.full-run, rules]

fuzz:v3:edge:stable:
  extends: .fuzz
  variables:
    BROWSER: edge $STABLE_EDGE_VERSION
  rules:
    - !reference [.full-run, rules]

# Compliance tests
.compliance:
  stage: compliance
  extends: .docker-image
  needs:
    - job: build
      artifacts: true
  before_script:
    - apk add bash git zip
  script:
    # When fixing EE-288, TESTS_TO_INCLUDE="filters/wildcard-domain"
    - TERMINAL="t" TESTS_TO_INCLUDE="filters/inline-css" ./test/scripts/compliance.sh
  after_script:
    - docker cp $(docker ps -aqf ancestor=compliance):/testpages.adblockplus.org/test/screenshots .
      2> /dev/null
  artifacts:
    paths:
      - screenshots/
    when: always
    expire_in: 1 day
  rules:
    - !reference [.master-run, rules]

comp:v2:firefox:
  extends: .compliance
  variables:
    VERSION: $STABLE_FIREFOX_VERSION
    BROWSER: firefox 
    MANIFEST: mv2

comp:v2:chromium:
  extends: .compliance
  variables:
    VERSION: $STABLE_CHROMIUM_VERSION
    BROWSER: chromium 
    MANIFEST: mv2
    
comp:v3:chromium:
  extends: .compliance
  variables:
    VERSION: $STABLE_CHROMIUM_VERSION
    BROWSER: chromium
    MANIFEST: mv3

comp:v3:edge:
  extends: .compliance
  variables:
    VERSION: $STABLE_EDGE_VERSION
    BROWSER: edge
    MANIFEST: mv3

# Integration tests
int:scripts:
  image: node:18-bullseye-slim
  needs: []
  stage: integration
  before_script:
    - npm install --production
  script:
    - cd test/scripts/test-extension
    - npm install
    - npm exec subs-init
    - npm exec subs-merge
    - npm exec subs-fetch
    - npm exec subs-convert -- -r
    - npm exec subs-generate
  rules:
    - !reference [.avoid-flaky-run, rules]

int:bundle:
  image: node:18-bullseye-slim
  stage: integration
  script:
    - npm run test-bundle
  needs:
    - job: build
      artifacts: true
  rules:
    - !reference [.avoid-flaky-run, rules]

.pages:
  image: node:18-bullseye-slim
  stage: pages
  dependencies:
    - build

include:
  - ".gitlab-pages.yml"
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Code-Quality.gitlab-ci.yml
