default:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  interruptible: true

stages:
  - build
  - pages
  - test
  - integration

variables:
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"

cache:
  - key:
      prefix: $CI_JOB_IMAGE
      files:
      - package-lock.json
    paths:
    - node_modules/
    - test/*-snapshots/download-cache/

build:
  stage: build
  before_script:
    - npm install
  script:
    - npm run lint
    - npm run build -- --env release
    - DOCS_ERROR=$(npm run docs 2>&1 >/dev/null) && if [ ! -z "$DOCS_ERROR" ]; then echo $DOCS_ERROR && false; fi
    - npm run test-bundle
    - npm run test-scripts
  artifacts:
    paths:
      - dist/
      - docs/
    exclude:
      - dist/package.json
    expire_in: 1 month

.docker-image:
  image: docker:19.03.5
  services:
    - docker:19.03.5-dind
  variables:
    DOCKER_DRIVER: overlay2

build:integration:
  stage: build
  extends: .docker-image
  script:
    - docker build -t extension -f test/dockerfiles/extension.Dockerfile .
    - docker run extension
    - docker cp $(docker ps -aqf ancestor=extension):/extension.zip .
  artifacts:
    paths:
      - extension.zip
    expire_in: 1 month

audit:
  stage: test
  needs: []
  before_script:
    - npm install
  script:
    - npm audit --production
  allow_failure: true

.test:
  stage: test
  before_script:
    - npm install
    - npm run test-server &
  needs:
    - job: build
      artifacts: true

test:v2:chromium:stable:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium

test:v2-subs:chromium:stable:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2-custom chromium

test:v2:chromium:oldest:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium 77.0.3865.0

test:v2:chromium:beta:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium beta

test:v2:chromium:dev:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium dev

test:v2:firefox:latest:
  extends: .test
  script:
    - npm test -- v2 firefox

test:v2:firefox:incognito:
  extends: .test
  script:
    - npm test -- v2 firefox --incognito

test:v2:firefox:oldest:
  extends: .test
  script:
    - npm test -- v2 firefox 68.0
  # https://gitlab.com/eyeo/adblockplus/webext-sdk/-/issues/50
  retry: 2

test:v2:firefox:beta:
  extends: .test
  script:
    - npm test -- v2 firefox beta

test:v2:edge:windows:
  extends: .test
  variables:
    CI_PROJECT_ID_MAINSTREAM: 22365241
  before_script:
    - Invoke-WebRequest
        -Uri "${Env:CI_API_V4_URL}/projects/${Env:CI_PROJECT_ID_MAINSTREAM}/packages/generic/microsoft-edge/79.0.309/MicrosoftEdgeEnterpriseX64.msi"
        -Headers @{'JOB-TOKEN' = $Env:CI_JOB_TOKEN}
        -OutFile 'MicrosoftEdgeEnterpriseX64.msi'
    - Start-Process msiexec
        -ArgumentList "/i MicrosoftEdgeEnterpriseX64.msi /norestart /qn" -Wait
    - choco upgrade -y nodejs --version 16.10.0
    - npm install
    - Start-Process "node" -ArgumentList "test/start-server.js" -PassThru
  script:
    - npm test -- v2 edge --timeout=10000
  tags:
    - shared-windows
    - windows
    - windows-1809
  cache: {}

test:v3:chromium:stable:
  extends: .test
  script:
    - xvfb-run -a npm test -- v3 chromium

test:v3:edge:linux:
  stage: test
  extends: .docker-image
  needs:
    - job: build
  script:
    - docker build -t functional -f test/dockerfiles/functional.Dockerfile .
    - docker run --shm-size=256m -e TEST_PARAMS="v3 edge" functional
  interruptible: true

.testpages-integration:
  stage: integration
  extends: .docker-image
  needs:
    - job: build:integration
      artifacts: true
  before_script:
    - apk add git
    - git clone https://gitlab.com/eyeo/adblockplus/abc/testpages.adblockplus.org.git
    - cp extension.zip testpages.adblockplus.org
  script:
    - cd testpages.adblockplus.org &&
      docker build -t testpages --build-arg EXTENSION_FILE="extension.zip" . &&
      docker run --shm-size=256m -e SKIP_EXTENSION_DOWNLOAD="true" -e TESTS_EXCLUDE="Snippets" -e BROWSER="$BROWSER" testpages
  after_script:
    - docker cp $(docker ps -aqf ancestor=testpages):/testpages.adblockplus.org/test/screenshots .
      2> /dev/null
  artifacts:
    paths:
      - screenshots/
    when: always
    expire_in: 1 mo

test:integration:chrome:latest:
  extends: .testpages-integration
  variables:
    BROWSER: Chromium \(latest\)

test:integration:chrome:oldest:
  extends: .testpages-integration
  variables:
    BROWSER: Chromium \(oldest\)

test:integration:chrome:beta:
  extends: .testpages-integration
  allow_failure: true
  variables:
    BROWSER: Chromium \(beta\)

test:integration:firefox:latest:
  extends: .testpages-integration
  variables:
    BROWSER: Firefox \(latest\)

test:integration:firefox:oldest:
  extends: .testpages-integration
  variables:
    BROWSER: Firefox \(oldest\)

test:integration:firefox:beta:
  extends: .testpages-integration
  allow_failure: true
  variables:
    BROWSER: Firefox \(beta\)

.pages:
  stage: pages
  dependencies:
    - build

include: ".gitlab-pages.yml"
