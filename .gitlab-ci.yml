include:
  - "/.gitlab/ci-common.yml"
  # Secrets detection
  - project: eyeo/devops/terraform/utils/ci-templates
    file: .gitlab-ci.gitleaks.yml
  # Security-focused static analysis
  - project: eyeo/devops/terraform/utils/ci-templates
    file: .gitlab-ci.semgrep.yml
  # Dependency vulnerability scanning
  - project: eyeo/devops/terraform/utils/ci-templates
    file: .gitlab-ci.trivy.yml

default:
  image: node:24.20.0
  cache: # Cache modules using lock file
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  interruptible: true
  tags:
    - "GCP"

workflow:
  rules:
    # Do not trigger merge request pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # The tag_release job waits for the whole main pipeline. A newer commit on
    # main must not auto-cancel it, or a release silently never gets tagged.
    # Pipelines can still be cancelled and retried by hand.
    - if: $CI_COMMIT_BRANCH == "main"
      auto_cancel:
        on_new_commit: none
    - when: always

stages:
  - pre_checks
  - root
  - children
  - release
  - notifications

.base:
  stage: root
  before_script:
    - npm ci --cache .npm --prefer-offline
    - if [[ "$CI_COMMIT_REF_NAME" != "main" ]]; then SINCE="--since origin/main"; fi
  rules:
    - !reference [.never-run-on-update-rules-trigger, rules]
    - when: on_success
  needs: []

.build:
  extends: .base
  before_script:
    - npm ci --cache .npm --prefer-offline
    # Create .env file from CI variables and confirm they have values
    - ./tools/release/create-environment-variables.sh ADBLOCK host/adblock/environment-variables > host/adblock/.env
    - ./tools/release/create-environment-variables.sh ADBLOCKPLUS host/adblockplus/environment-variables > host/adblockplus/.env

build:
  extends: .build
  script:
    - npm run build
  artifacts:
    name: "extensions-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - core/sdk/dist/
      - host/adblock/dist/devenv/
      - host/adblockplus/dist/devenv/
      - fragment/test/dist/
      - tools/rules/dist/
    expire_in: 1 month

build:release:
  extends: .build
  script:
    - npm run build:source
    - npm run build:release
  artifacts:
    name: "extensions-release-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - core/sdk/dist/
      - host/adblock/dist/release/
      - host/adblockplus/dist/release/
    expire_in: 1 month

lint:
  extends: .base
  script:
    - npm run lint

test:
  extends: .base
  script:
    - npm test -- $SINCE

check_package_lock:
  extends: .base
  script:
    - npm run -w @eyeo/release-utils check-package-lock

update_rules:
  stage: root
  image: gitlab/glab
  variables:
    # prepare-release derives versions from tags and history, so it needs a full clone
    GIT_DEPTH: 0
  before_script:
    - apk add bash git nodejs npm jq
    - npm install -g "npm@>=11.17.0"
    - hash -r
    - git config --global user.email "extensions-release-squad@eyeo.com"
    - git config --global user.name "Eyeo Gitlab Automaton"
    - glab auth login --token $GITLAB_TOKEN_MERGE_REQUEST
    - git remote set-url --push origin "https://$GITLAB_TOKEN_MERGE_REQUEST_NAME:$GITLAB_TOKEN_MERGE_REQUEST@gitlab.com/$CI_PROJECT_PATH.git"
    - npm ci --cache .npm --prefer-offline
  script:
    - ./tools/release/update-rules-dependency.sh
  rules:
    - !reference [.only-run-on-update-rules-trigger, rules]
  needs: []

tools:
  extends: .base
  stage: children
  script:
    - npm run -w @eyeo/release-utils test:end-to-end
    - npm run -w @eyeo/rules-utils test:end-to-end
  needs: ["build"]

.child:
  stage: children
  trigger:
    include:
      - local: "$WORKSPACEPATH/.gitlab-ci.yml"
      - local: "/.gitlab/ci-run-jobs-n-times.yml"
        rules:
          - if: $NIGHTLY_RUN == "true"
    strategy: depend
    forward:
      pipeline_variables: true
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  needs:
    # We need these artifacts in the downstream pipelines themselves so we need
    # to wait for the jobs to finish before triggering downstream.
    - job: "build"
      artifacts: false
    - job: "build:release"
      artifacts: false

.child-host:
  extends: .child
  rules:
    - !reference [.never-run-on-update-rules-trigger, rules]
    # Always run everything on the main branch and tags
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
    # On feature branches, only run pipelines for a workspace if there are changes
    # either in that workspace or in shared test utils
    - changes:
        paths:
          - $WORKSPACEPATH/**/*
          - core/**/*
          - fragment/**/*
          - tools/**/*
          - ui-components/**/*
          - vendor/**/*
          - "*"
        compare_to: "refs/heads/main"
      when: on_success

.child-core:
  extends: .child
  rules:
    - !reference [.never-run-on-update-rules-trigger, rules]
    # Always run everything on the main branch and tags
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success
    # On feature branches, only run pipelines for a workspace if there are changes
    # either in that workspace or in shared test utils
    - changes:
        paths:
          - $WORKSPACEPATH/**/*
          - tools/test/**/*
          - vendor/**/*
          - "*"
        compare_to: "refs/heads/main"
      when: on_success

adblock:
  extends: .child-host
  variables:
    WORKSPACEPATH: host/adblock

adblockplus:
  extends: .child-host
  variables:
    WORKSPACEPATH: host/adblockplus

fragments:
  extends: .child-host
  variables:
    WORKSPACEPATH: fragment

sdk:
  extends: .child-core
  variables:
    WORKSPACEPATH: core/sdk

publish-remote-validation:
  stage: children
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo -e "\n@eyeo:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" >> .npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - echo "//gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish --workspace=core/remote-configuration-validator
  rules:
    - !reference [.never-run-on-update-rules-trigger, rules]
    # Do not trigger for schedule pipelines
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Only run when:
    # - merging to the main branch
    # - the package.json file for the project is updated
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - core/remote-configuration-validator/package.json
      when: always
    # Fallback to prevent unintended runs
    - when: never
  needs: []

################################################################################
# Notifications
################################################################################

notify_events_schema_change:
  stage: notifications
  image: alpine:latest
  cache: []
  allow_failure: true
  before_script:
    - apk add --no-cache curl
  script:
    - 'curl -X POST -H "Content-type: application/json" --data "{\"text\":\"events.js has been updated on main by ${CI_COMMIT_AUTHOR%% <*} - ${CI_PIPELINE_URL}\"}" $SLACK_WEBHOOK_EVENTS_SCHEMA'
  rules:
    - !reference [.never-run-on-update-rules-trigger, rules]
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - core/sdk/events.js
      when: on_success
    - when: never
  needs: []

################################################################################
# Release
################################################################################

.on-any-release-tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\w+-\d+(\.\d+)*$/'
      when: on_success
    - when: never
  before_script:
    - HOST=${CI_COMMIT_TAG%-*}
    - VERSION=${CI_COMMIT_TAG#*-}
    - |
      case "$HOST" in
        "adblock")
          HOST_PRETTY_NAME="AdBlock"
          ;;
        "adblockplus")
          HOST_PRETTY_NAME="Adblock Plus"
          ;;
        "sdk")
          HOST_PRETTY_NAME="Webext SDK"
          ;;
        *)
          echo "Error: Unsupported host $HOST in release tag." >&2
          exit 1
          ;;
      esac

.on-host-release-tag:
  extends: .on-any-release-tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(adblock|adblockplus)-\d+(\.\d+)*$/'
      when: on_success
    - when: never

.gitlab-api-release-automation:
  stage: release
  image: gitlab/glab
  before_script:
    - !reference [.on-any-release-tag, before_script]
    - apk add git nodejs jq
    - glab auth login --token $GITLAB_TOKEN_RELEASE
    - git remote set-url --push origin "https://$GITLAB_TOKEN_RELEASE_NAME:$GITLAB_TOKEN_RELEASE@gitlab.com/$CI_PROJECT_PATH.git"
  rules:
    - !reference [.on-any-release-tag, rules]

create_release:
  extends: .gitlab-api-release-automation
  needs: ["build:release"]
  script:
    - release_notes=$(node tools/release/get-release-notes.js $HOST $VERSION)
    - |
      case "$HOST" in
        "adblock"|"adblockplus")
          ARTIFACTS="host/$HOST/dist/release/* core/sdk/dist/events.json"
          ;;
        "sdk")
          ARTIFACTS=""
          ;;
        *)
          echo "Error: Unsupported host $HOST in release tag." >&2
          exit 1
          ;;
      esac
    - glab release create $CI_COMMIT_TAG -n "$HOST_PRETTY_NAME $VERSION" $ARTIFACTS -N "$release_notes"

create_release_mr_back_to_main:
  extends: .gitlab-api-release-automation
  resource_group: merge-back-${CI_COMMIT_SHA}
  needs: []
  script:
    - git fetch origin main
    - |
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        echo "Tagged commit is already on main, no merge back needed"
        exit 0
      fi
    - |
      if glab mr list --all --order created_at --output json | jq -r ".[].sha" | grep "$CI_COMMIT_SHA" ; then
        echo "MR already exists for commit $CI_COMMIT_SHA"
      else
        git checkout -B $CI_COMMIT_TAG-merge-back-to-main refs/tags/$CI_COMMIT_TAG
        git push origin $CI_COMMIT_TAG-merge-back-to-main
        # Using glab api because glab mr create doesn't support setting --squash=false. See https://gitlab.com/gitlab-org/cli/-/issues/8144
        glab api -X POST projects/:id/merge_requests -F source_branch="$CI_COMMIT_TAG-merge-back-to-main" -F target_branch="main" -F title="$CI_COMMIT_TITLE" -F description="Automatically bringing release changes back to the main branch" -F squash=false -F remove_source_branch=true
      fi

tag_release:
  stage: release
  # Runs as soon as the pipeline starts. The merged commit is the one the MR
  # pipeline already tested, because main only fast-forwards, so waiting for the
  # tests to run again on main would only delay the release.
  needs: []
  rules:
    - !reference [.never-run-on-update-rules-trigger, rules]
    # "changes" is always true for scheduled pipelines, and nightly runs have nothing to tag
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # A host version on main that has no tag yet gets tagged, which starts the
    # existing tag pipeline. Merging the weekly release MR is what changes these files.
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        paths:
          - host/adblock/build/config/base.mjs
          - host/adblockplus/build/webext/config/base.mjs
      when: on_success
    - when: never
  before_script:
    - git config --global user.email "extensions-release-squad@eyeo.com"
    - git config --global user.name "Eyeo Gitlab Automaton"
    - git remote set-url --push origin "https://$GITLAB_TOKEN_RELEASE_NAME:$GITLAB_TOKEN_RELEASE@gitlab.com/$CI_PROJECT_PATH.git"
  script:
    - |
      for HOST in adblock adblockplus; do
        case "$HOST" in
          adblock) CONFIG=host/adblock/build/config/base.mjs ;;
          adblockplus) CONFIG=host/adblockplus/build/webext/config/base.mjs ;;
        esac
        VERSION=$(sed -n 's/^ *version: "\([^"]*\)",*$/\1/p' "$CONFIG" | head -1)
        TAG="$HOST-$VERSION"
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
          echo "$TAG already exists, nothing to do"
        else
          git tag -a -m "" "$TAG"
          git push origin "$TAG"
          echo "Created and pushed $TAG"
        fi
      done

# Prints the #releases Slack message for both extensions once the release is
# tagged. See tools/release/README.md.
announce_release:
  stage: notifications
  cache: []
  needs: [tag_release]
  rules:
    - !reference [tag_release, rules]
  script:
    - node tools/release/announcement.js

upload_sourcemaps:
  stage: release
  needs: ["build:release"]
  rules:
    - !reference [.on-host-release-tag, rules]
  before_script:
    - !reference [.on-host-release-tag, before_script]
    - npm ci --cache .npm --prefer-offline
  script:
    - cd host/$HOST
    - npm run sentry:login -- --auth-token $SENTRY_AUTH_TOKEN
    - echo "Uploading the sourcemaps for $HOST_PRETTY_NAME $VERSION"
    - VERSION=$VERSION npm run sentry:release-new
    - mkdir -p ./dist/sourcemaps/chrome-mv3
    - unzip dist/release/$HOST-chrome-*-mv3.zip -d ./dist/sourcemaps/chrome-mv3/
    - VERSION=$VERSION npm run sentry:sourcemaps
    - VERSION=$VERSION npm run sentry:release-finalize

# Authenticates to Google Cloud through Workload Identity Federation. Google
# only accepts protected adblock-* and adblockplus-* tags of this project.
.google-workload-identity:
  cache: []
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/15970330933/locations/global/workloadIdentityPools/gitlab/providers/gitlab-com
  variables:
    GCP_PROJECT_NUMBER: "15970330933"
    GCP_WORKLOAD_IDENTITY_POOL_ID: gitlab
    GCP_WORKLOAD_IDENTITY_PROVIDER_ID: gitlab-com

# Store uploads are started by hand once the GitLab release exists. They
# download the release files in RELEASE_FILES, where VERSION stands for the
# release's version.
.store-upload:
  extends: .google-workload-identity
  stage: release
  needs:
    - job: create_release
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(adblock|adblockplus)-\d+(\.\d+)*$/'
      when: manual
      allow_failure: true
    - when: never
  interruptible: false
  before_script:
    - !reference [.on-host-release-tag, before_script]
    - mkdir -p "host/$HOST/dist/release"
    - |
      for FILE in $RELEASE_FILES; do
        FILE="$HOST-${FILE//VERSION/$VERSION}"
        echo "Downloading $FILE from the $CI_COMMIT_TAG release"
        curl --fail --location --silent --show-error --output "host/$HOST/dist/release/$FILE" "$CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/$FILE"
      done

# Uploads to the Chrome Web Store and submits for review. See
# docs/GITLAB_RELEASES.md.
upload_chrome_web_store:
  extends: .store-upload
  variables:
    RELEASE_FILES: chrome-VERSION-mv3.zip
  script:
    - node tools/release/stores/chrome/upload.js "$HOST" "$VERSION"

# Uploads to Microsoft Edge Add-ons and submits for review. See
# docs/GITLAB_RELEASES.md.
upload_edge_add_ons:
  extends: .store-upload
  variables:
    RELEASE_FILES: chrome-VERSION-mv3.zip
  script:
    - node tools/release/stores/edge/upload.js "$HOST" "$VERSION"

# Uploads to Firefox Add-ons and submits the version for review, with its
# source code. Not needed for rules-only releases. See
# docs/GITLAB_RELEASES.md.
upload_firefox_add_ons:
  extends: .store-upload
  variables:
    RELEASE_FILES: firefox-VERSION-mv2.xpi VERSION.tar.gz
  script:
    - node tools/release/stores/firefox/upload.js "$HOST" "$VERSION"

################################################################################
# Overrides for jobs from included templates
################################################################################

semgrep:sast:
  variables:
    SEMGREP_EXTRA_ARGS: "--config=.semgrep.yml"

trivy:sca:
  allow_failure: true
  variables:
    TRIVY_EXTRA_ARGS: "--include-dev-deps --ignorefile .trivyignore.yaml"
