default:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  interruptible: true

stages:
  - build
  - test
  - testPages

variables:
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"

cache:
  - key:
      prefix: $CI_JOB_IMAGE
      files:
      - package-lock.json
    paths:
    - node_modules/
    - test/*-snapshots/download-cache/

build:
  stage: build
  before_script:
    # make and g++ required by node-gyp (abp2dnr dependency)
    - apt-get update && apt-get install -y make g++
    - npm install
  script:
    - npm run lint
    - npm run build -- --env release
    - DOCS_ERROR=$(npm run docs 2>&1 >/dev/null) && if [ ! -z "$DOCS_ERROR" ]; then echo $DOCS_ERROR && false; fi
    - npm run test-bundle
  artifacts:
    paths:
      - dist/
      - docs/
    exclude:
      - dist/package.json
    expire_in: 1 month

audit:
  stage: test
  before_script:
    - npm install
  script:
    - npm audit --production
  allow_failure: true

.test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y make g++
    - npm install
    - npm run test-server &
  needs:
    - job: build
      artifacts: true

test:v2:chromium:stable:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium

test:v2-subs:chromium:stable:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2-custom chromium

test:v2:chromium:oldest:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium 77.0.3865.0

test:v2:chromium:beta:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium beta

test:v2:chromium:dev:
  extends: .test
  script:
    - xvfb-run -a npm test -- v2 chromium dev

test:v2:firefox:latest:
  extends: .test
  script:
    - npm test -- v2 firefox

test:v2:firefox:oldest:
  extends: .test
  script:
    - npm test -- v2 firefox 68.0
  # https://gitlab.com/eyeo/adblockplus/webext-sdk/-/issues/50
  retry: 2

test:v2:firefox:beta:
  extends: .test
  script:
    - npm test -- v2 firefox beta

test:v2:edge:windows:
  extends: .test
  variables:
    CI_PROJECT_ID_MAINSTREAM: 22365241
  before_script:
    - Invoke-WebRequest
        -Uri "${Env:CI_API_V4_URL}/projects/${Env:CI_PROJECT_ID_MAINSTREAM}/packages/generic/microsoft-edge/79.0.309/MicrosoftEdgeEnterpriseX64.msi"
        -Headers @{'JOB-TOKEN' = $Env:CI_JOB_TOKEN}
        -OutFile 'MicrosoftEdgeEnterpriseX64.msi'
    - Start-Process msiexec
        -ArgumentList "/i MicrosoftEdgeEnterpriseX64.msi /norestart /qn" -Wait
    # python2 is required by node-gyp (abp2dnr dependency)
    - choco install -y python2
    - choco upgrade -y nodejs --version 16.10.0
    - npm install
    - Start-Process "node" -ArgumentList "test/start-server.js" -PassThru
  script:
    - npm test -- v2 edge --timeout=15000
  tags:
    - shared-windows
    - windows
    - windows-1809
  cache: {}

test:v3:chromium:stable:
  extends: .test
  script:
    - xvfb-run -a npm test -- v3 chromium

test:v3:edge:linux:
  stage: test
  image: docker:19.03.5
  services:
    - docker:19.03.5-dind
  script:
    - docker info
    - docker build  --no-cache -t webext -f test/dockerfiles/Dockerfile .
    - docker run --shm-size=256m webext  
  interruptible: true

.testpages-integration:
  stage: testPages
  image: docker:19.03.5
  services:
    - docker:19.03.5-dind
  before_script:
    - docker info
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - docker build -t testpages -f test/dockerfiles/testpages.Dockerfile .
    - docker run --shm-size=256m -e SKIP_EXTENSION_DOWNLOAD="true" -e BROWSER="$BROWSER" testpages 
  after_script:
    - IMAGE_ID=$(docker ps -aqf ancestor=testpages)
    - echo "Copying files"
    - docker cp $IMAGE_ID:/testpages.adblockplus.org/test/screenshots .
      2> /dev/null
    - docker cp $IMAGE_ID:/adblockpluschrome.zip .
  artifacts:
    paths:
      - screenshots/
      - adblockpluschrome.zip
    expire_in: 1 mo

testPages:chrome:latest:
  extends: .testpages-integration
  variables:
    BROWSER: Chromium \(latest\)

testPages:chrome:oldest:
  extends: .testpages-integration
  variables:
    BROWSER: Chromium \(oldest\)

testPages:firefox:latest:
  extends: .testpages-integration
  variables:
    BROWSER: Firefox \(latest\)

testPages:firefox:oldest:
  extends: .testpages-integration
  variables:
    BROWSER: Firefox \(oldest\)
