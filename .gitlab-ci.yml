default:
  interruptible: true

.manual-run:
  rules:
    # Do not trigger a merge request pipeline
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Run automatically on master branch
    - if: $CI_COMMIT_BRANCH == "master"
      allow_failure: true
    # Run manually on all other branches
    - when: manual
      allow_failure: true

# Used for running only functional tests 
.flaky-run:
  rules:
    # Do not trigger a merge request pipeline
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Don't run automatically on commit that contains flaky
    - if: $CI_COMMIT_MESSAGE =~ /\[flaky]/
      when: manual
    # Run automatically if other conditions not filled
    - when: always

.docker-image:
  image: docker:19.03.5
  services:
    - docker:19.03.5-dind
  variables:
    DOCKER_DRIVER: overlay2

stages:
  - build
  - pages
  - unit
  - functional
  - fuzz
  - integration

variables:
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_prefer_offline: "true"

  # Browser versions we use:
  
  LATEST_CHROME_VERSION: 109.0.5414.0
  OLDEST_CHROME_VERSION: 77.0.3865.0
  LATEST_FIREFOX_VERSION: "109.0"
  OLDEST_FIREFOX_VERSION: "68.0"
  LATEST_EDGE_VERSION: 108.0.1462.76

build:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  stage: build
  before_script:
    - npm install
  script:
    - npm run build
    - DOCS_ERROR=$(npm run docs 2>&1 >/dev/null) && if [ ! -z "$DOCS_ERROR" ]; then echo $DOCS_ERROR && false; fi
    - npm run docs-core
  artifacts:
    paths:
      - dist/
      - dist/docs
    expire_in: 1 month

audit:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  stage: build
  before_script:
    - npm install
  script:
    - npm audit --production
  allow_failure: true
  rules:
    - !reference [.flaky-run, rules]

lint:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  stage: build
  before_script:
    - npm install
  script:
    - npm run lint

# Unit tests

.unit:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  stage: unit
  needs: []
  before_script:
    - npm install
  rules:
    - !reference [.flaky-run, rules]

unit:core:
  extends: .unit
  script:
    - npm run test-core
    - npm run -w core test:dist

unit:benchmark:core:
  extends: .unit
  script:
    - npm run -w core benchmark
    - npm run -w core benchmark:save
    - npm run -w core benchmark:compare

unit:webext:
  extends: .unit
  script:
    - npm run unittest

# Functional Tests

func:scripts:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  stage: functional
  needs: []
  before_script:
    - npm install
  script:
    - npm run test-scripts
  rules:
    - !reference [.flaky-run, rules]

func:bundle:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  stage: functional
  script:
    - npm run test-bundle
  needs:
    - job: build
      artifacts: true
  rules:
    - !reference [.flaky-run, rules]

.functional:
  stage: functional
  extends: .docker-image
  needs:
    - job: build
      artifacts: true
  before_script:
    - docker build -t functional -f test/dockerfiles/functional.Dockerfile --build-arg SKIP_BUILD=1 .
  script:
    - docker run --shm-size=512m -e TEST_PARAMS="$TEST_PARAMS" -e MODE="$CI_COMMIT_MESSAGE" functional

func:v2:chromium:stable:
  extends: .functional
  variables:
    TEST_PARAMS: v2 chromium $LATEST_CHROME_VERSION

func:v2:chromium:stable:incognito:
  extends: .functional
  variables:
    TEST_PARAMS: v2 chromium $LATEST_CHROME_VERSION --incognito

func:v2-subs:chromium:stable:
  extends: .functional
  variables:
    TEST_PARAMS: v2-custom chromium $LATEST_CHROME_VERSION

func:v2:chromium:oldest:
  extends: .functional
  variables:
    TEST_PARAMS: v2 chromium $OLDEST_CHROME_VERSION

func:v2:chromium:beta:
  extends: .functional
  variables:
    TEST_PARAMS: v2 chromium beta
  rules:
    - !reference [.manual-run, rules]

func:v2:chromium:dev:
  extends: .functional
  variables:
    TEST_PARAMS: v2 chromium dev
  rules:
    - !reference [.manual-run, rules]

func:v2:firefox:stable:
  extends: .functional
  variables:
    TEST_PARAMS: v2 firefox $LATEST_FIREFOX_VERSION

func:v2:firefox:incognito:
  extends: .functional
  variables:
    TEST_PARAMS: v2 firefox $LATEST_FIREFOX_VERSION --incognito

func:v2:firefox:oldest:
  extends: .functional
  variables:
    TEST_PARAMS: v2 firefox $OLDEST_FIREFOX_VERSION

func:v2:firefox:beta:
  extends: .functional
  variables:
    TEST_PARAMS: v2 firefox beta
  rules:
    - !reference [.manual-run, rules]

# https://gitlab.com/eyeo/adblockplus/abc/webext-sdk/-/issues/369
func:v2:firefox:update:incognito:
  extends: .functional
  variables:
    TEST_PARAMS: v2 firefox $LATEST_FIREFOX_VERSION --testKinds update --incognito
  rules:
    - !reference [.flaky-run, rules]

.func:v2:windows:edge:
  stage: functional
  needs:
    - job: build
      artifacts: true
  variables:
    CI_PROJECT_ID_MAINSTREAM: 22365241
  before_script:
    - Invoke-WebRequest
        -Uri "${Env:CI_API_V4_URL}/projects/${Env:CI_PROJECT_ID_MAINSTREAM}/packages/generic/microsoft-edge/79.0.309/MicrosoftEdgeEnterpriseX64.msi"
        -Headers @{'JOB-TOKEN' = $Env:CI_JOB_TOKEN}
        -OutFile 'MicrosoftEdgeEnterpriseX64.msi'
    - Start-Process msiexec
        -ArgumentList "/i MicrosoftEdgeEnterpriseX64.msi /norestart /qn" -Wait
    - choco upgrade -y nodejs --version 16.18.1
    - npm install -g npm
    - npm install
    - Start-Process "node" -ArgumentList "test/start-server.js" -PassThru
  tags:
    - shared-windows
    - windows
    - windows-1809

func:v2:windows:edge:stable:
  extends: .func:v2:windows:edge
  script:
    - npm test -- v2 edge $LATEST_EDGE_VERSION --timeout=10000

func:v2:windows:edge:incognito:
  extends: .func:v2:windows:edge
  script:
    - npm test -- v2 edge $LATEST_EDGE_VERSION --incognito --timeout=10000

# Functional MV3 tests 

func:v3:chromium:stable:
  extends: .functional
  variables:
    TEST_PARAMS: v3 chromium $LATEST_CHROME_VERSION --testKinds functional reload update
   
func:v3:chromium:stable:incognito:
  extends: .functional
  variables:
    TEST_PARAMS: v3 chromium $LATEST_CHROME_VERSION --testKinds functional reload update --incognito

func:v3:edge:linux:
  extends: .functional
  variables:
    TEST_PARAMS: v3 edge $LATEST_EDGE_VERSION --testKinds functional reload update

# This jobs will be run on nightly runs of the pipeline
.functional-nightly:
  extends: .functional
  rules:
    - if: '$NIGHTLY != "true"'
      when: never

func:v2:chromium:latest:
  extends: .functional-nightly
  variables:
    TEST_PARAMS: v2 chromium --testKinds functional reload update

func:v3:chromium:latest:
  extends: .functional-nightly
  variables:
    TEST_PARAMS: v3 chromium --testKinds functional reload update

func:v2:firefox:latest:
  extends: .functional-nightly
  variables:
    TEST_PARAMS: v2 firefox --testKinds functional reload update

func:v2:edge:linux:latest:
  extends: .functional-nightly
  variables:
    TEST_PARAMS: v2 edge --testKinds functional reload update

func:v3:edge:linux:latest:
  extends: .functional-nightly
  variables:
    TEST_PARAMS: v3 edge --testKinds functional reload update

# Fuzz tests 

.fuzz:
  extends: .functional
  stage: fuzz
  script:
    - docker run --shm-size=512m -e TEST_PARAMS="v3 $BROWSER --testKinds fuzz --grep ^$FUNCTIONAL_AREA" functional
  parallel:
    matrix:
      - FUNCTIONAL_AREA:
        - "(Blocking|Pop-up\\sblocking)"
        - "(Element\\sHiding|Snippets)"
        - "API\\sReporting"
        - "API\\sNotifications"
        - "API\\s(?!Reporting|Notifications)"
        - "(?!Blocking|Pop-up\\sblocking|Element\\sHiding|Snippets|API)"
  rules:
    - !reference [.flaky-run, rules]

fuzz:v3:chromium:stable:
  extends: .fuzz
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION

fuzz:v3:chromium:stable:incognito:
  extends: .fuzz
  variables:    
    BROWSER: chromium $LATEST_CHROME_VERSION --incognito
  rules:
    - !reference [.manual-run, rules]

# Fuzz tests is running on Edge 108 only so we don't need to increase timeout
fuzz:v3:edge:linux:
  extends: .fuzz
  variables:    
    BROWSER: edge $LATEST_EDGE_VERSION

# Integration tests (skipped for commits)

build:integration:
  stage: build
  extends: .docker-image
  script:
    - docker build -t extension -f test/dockerfiles/extension.Dockerfile .
    - docker run extension
    - docker cp $(docker ps -aqf ancestor=extension):/extension .
  artifacts:
    paths:
      - extension
    expire_in: 1 month
  rules:
    - if: '$NIGHTLY != "true"'
      when: never

.integration:
  stage: integration
  extends: .docker-image
  allow_failure: true # There are breaking changes to the subscriptions API in 0.6 that break most tests
  variables:
    MANIFEST: mv2
  needs:
    - job: build:integration
      artifacts: true
  before_script:
    - apk add git
    - git clone https://gitlab.com/eyeo/developer-experience/testpages.adblockplus.org.git
    - cp "extension/extension$MANIFEST.zip" testpages.adblockplus.org
  script:
    - cd testpages.adblockplus.org &&
      docker build -t testpages --build-arg EXTENSION_FILE="extension$MANIFEST.zip" . &&
      docker run --shm-size=512m -e SKIP_EXTENSION_DOWNLOAD="true" -e GREP="^.*$BROWSER((?!Snippets$SKIP).)*\$" testpages
  after_script:
    - docker cp $(docker ps -aqf ancestor=testpages):/testpages.adblockplus.org/test/screenshots .
      2> /dev/null
  artifacts:
    paths:
      - screenshots/
    when: always
    expire_in: 1 mo
  rules:
    - if: '$NIGHTLY != "true"'
      when: never

int:v2:chrome:latest:
  extends: .integration
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION

int:v2:chrome:oldest:
  extends: .integration
  variables:
    BROWSER: chromium $OLDEST_CHROME_VERSION

int:v2:firefox:latest:
  extends: .integration
  variables:
    BROWSER: firefox $LATEST_FIREFOX_VERSION

int:v2:firefox:oldest:
  extends: .integration
  variables:
    BROWSER: firefox $OLDEST_FIREFOX_VERSION

.integration:v3:
  extends: .integration
  variables:
    MANIFEST: mv3
    SKIP: "|Header|Sitekey|Subscriptions"

int:v3:chrome:latest:
  extends: .integration:v3
  variables:
    BROWSER: chromium $LATEST_CHROME_VERSION

int:scripts:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  needs: []
  stage: integration
  before_script:
    - npm install --production
  script:
    - cd test/scripts/test-extension
    - npm install
    - npm exec subs-init
    - npm exec subs-merge
    - npm exec subs-fetch
    - npm exec subs-convert -- -r
    - npm exec subs-generate
  rules:
    - !reference [.flaky-run, rules]

.pages:
  image: registry.gitlab.com/eyeo/docker/adblockplus-ci:node16-no-python
  stage: pages
  dependencies:
    - build

include: ".gitlab-pages.yml"
